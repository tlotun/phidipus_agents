    bundles: ["@chromium"]
    shortcuts:
      - {id: new_tab,        keys: "cmd+t",        desc: "New tab", say: [tab mới, mở tab mới, new tab], expect: window}
      - {id: close_tab,      keys: "cmd+w",        desc: "Close tab", say: [đóng tab, close tab], expect: window}
      - {id: reopen_tab,     keys: "cmd+shift+t",  desc: "Reopen last closed tab", say: [mở lại tab vừa đóng, khôi phục tab, reopen tab], expect: window}
      - {id: new_window,     keys: "cmd+n",        desc: "New window", say: [cửa sổ mới, new window], expect: window}
      - {id: incognito,      keys: "cmd+shift+n",  desc: "New incognito window", say: [tab ẩn danh, cửa sổ ẩn danh, incognito], expect: window}
      - {id: address_bar,    keys: "cmd+l",        desc: "Focus the address bar", say: [thanh địa chỉ, address bar, url bar]}
      - {id: reload,         keys: "cmd+r",        desc: "Reload page", say: [làm mới, tải lại trang, refresh, reload]}
      - {id: hard_reload,    keys: "cmd+shift+r",  desc: "Reload ignoring cache", say: [tải lại không cache, hard reload]}
      - {id: back,           keys: "cmd+[",        desc: "Back", say: [quay lại, trang trước, back], expect: window}
      - {id: forward,        keys: "cmd+]",        desc: "Forward", say: [tiến tới, trang sau, forward], expect: window}
      - {id: next_tab,       keys: "cmd+alt+right", desc: "Next tab", say: [tab sau, tab tiếp theo, next tab], expect: window}
      - {id: prev_tab,       keys: "cmd+alt+left", desc: "Previous tab", say: [tab trước, previous tab], expect: window}
      - {id: tab_1,          keys: "cmd+1",        desc: "Go to first tab", say: [tab đầu tiên, tab 1, first tab], expect: window}
      - {id: tab_2,          keys: "cmd+2",        desc: "Go to tab 2", say: [tab 2, tab thứ hai], expect: window}
      - {id: tab_3,          keys: "cmd+3",        desc: "Go to tab 3", say: [tab 3, tab thứ ba], expect: window}
      - {id: last_tab,       keys: "cmd+9",        desc: "Go to last tab", say: [tab cuối, tab cuối cùng, last tab], expect: window}
      - {id: search_tabs,    keys: "cmd+shift+a",  desc: "Search open tabs", say: [tìm tab, tìm trong các tab, search tabs]}
      - {id: find,           keys: "cmd+f",        desc: "Find in page", say: [tìm trong trang, find in page]}
      - {id: downloads,      keys: "cmd+shift+j",  desc: "Downloads page", say: [mở trang tải xuống, xem file đã tải, downloads], expect: window}
      - {id: history,        keys: "cmd+y",        desc: "History page", say: [lịch sử duyệt web, mở lịch sử, history], expect: window}
      - {id: bookmarks_bar,  keys: "cmd+shift+b",  desc: "Show / hide bookmarks bar", say: [thanh dấu trang, bookmarks bar]}
      - {id: bookmark_page,  keys: "cmd+d",        desc: "Bookmark this page", say: [lưu dấu trang, đánh dấu trang, bookmark]}
      - {id: bookmark_manager, keys: "cmd+alt+b",  desc: "Bookmark manager", say: [quản lý dấu trang, bookmark manager], expect: window}
      - {id: devtools,       keys: "cmd+alt+i",    desc: "Developer tools", say: [dev tools, công cụ nhà phát triển, devtools]}
      - {id: js_console,     keys: "cmd+alt+j",    desc: "JavaScript console", say: [mở console, javascript console]}
      - {id: view_source,    keys: "cmd+alt+u",    desc: "View page source", say: [xem mã nguồn trang, view source], expect: window}
      - {id: save_page,      keys: "cmd+s",        desc: "Save page as…", say: [lưu trang web, save page]}
      - {id: clear_data,     keys: "cmd+shift+delete", desc: "Clear browsing data dialog", say: [xoá dữ liệu duyệt web, clear browsing data], risk: medium}

  # ── Safari ─────────────────────────────────────────────────────────
  - name: safari
    bundles: [com.apple.Safari]
    shortcuts:
      - {id: new_tab,        keys: "cmd+t",        desc: "New tab", say: [tab mới, mở tab mới, new tab], expect: window}
      - {id: close_tab,      keys: "cmd+w",        desc: "Close tab", say: [đóng tab, close tab], expect: window}
      - {id: reopen_tab,     keys: "cmd+shift+t",  desc: "Reopen last closed tab", say: [mở lại tab vừa đóng, reopen tab], expect: window}
      - {id: address_bar,    keys: "cmd+l",        desc: "Focus the address bar", say: [thanh địa chỉ, address bar]}
      - {id: reload,         keys: "cmd+r",        desc: "Reload page", say: [làm mới, tải lại trang, refresh, reload]}
      - {id: back,           keys: "cmd+[",        desc: "Back", say: [quay lại, trang trước, back], expect: window}
      - {id: forward,        keys: "cmd+]",        desc: "Forward", say: [tiến tới, trang sau, forward], expect: window}
      - {id: next_tab,       keys: "cmd+shift+]",  desc: "Next tab", say: [tab sau, tab tiếp theo, next tab], expect: window}
      - {id: prev_tab,       keys: "cmd+shift+[",  desc: "Previous tab", say: [tab trước, previous tab], expect: window}
      - {id: all_tabs,       keys: "cmd+shift+\\", desc: "Show all tabs", say: [xem tất cả tab, show all tabs]}
      - {id: downloads,      keys: "cmd+alt+l",    desc: "Show downloads", say: [xem file đã tải, downloads]}
      - {id: history,        keys: "cmd+y",        desc: "Show history", say: [lịch sử duyệt web, mở lịch sử, history]}
      - {id: reader,         keys: "cmd+shift+r",  desc: "Reader mode", say: [chế độ đọc, reader mode]}
      - {id: private,        keys: "cmd+shift+n",  desc: "New private window", say: [cửa sổ riêng tư, tab ẩn danh, private window], expect: window}
      - {id: bookmark_page,  keys: "cmd+d",        desc: "Add bookmark", say: [lưu dấu trang, đánh dấu trang, bookmark]}
      - {id: find,           keys: "cmd+f",        desc: "Find in page", say: [tìm trong trang, find in page]}

  # ── Gmail web (Gmail "keyboard shortcuts" setting must be ON) ──────
  - name: gmail
    bundles: ["@browser"]
    url: mail.google.com
    when: no_text_focus
    shortcuts:
      - {id: compose,       keys: "c",            desc: "Compose a new email", say: [soạn email, soạn thư mới, viết email mới, compose]}
      - {id: reply,         keys: "r",            desc: "Reply", say: [trả lời email, reply]}
      - {id: reply_all,     keys: "a",            desc: "Reply all", say: [trả lời tất cả, reply all]}
      - {id: forward,       keys: "f",            desc: "Forward", say: [chuyển tiếp email, forward email]}
      - {id: search,        keys: "/",            desc: "Focus Gmail search", say: [tìm email, tìm trong gmail, search mail]}
      - {id: archive,       keys: "e",            desc: "Archive conversation", say: [lưu trữ email, archive]}
      - {id: delete,        keys: "shift+3",      desc: "Delete conversation", say: [xoá email, xóa email này, delete email], risk: high}
      - {id: newer,         keys: "k",            desc: "Newer conversation", say: [email mới hơn, newer email]}
      - {id: older,         keys: "j",            desc: "Older conversation", say: [email cũ hơn, older email]}
      - {id: mark_unread,   keys: "shift+u",      desc: "Mark as unread", say: [đánh dấu chưa đọc, mark unread]}
      - {id: mark_read,     keys: "shift+i",      desc: "Mark as read", say: [đánh dấu đã đọc, mark read]}

  - name: gmail_send
    bundles: ["@browser"]
    url: mail.google.com
    shortcuts:
      - {id: send, keys: "cmd+return", desc: "Send the email being composed", say: [gửi email, gửi thư, send email], risk: high}

  # ── Apple Mail ─────────────────────────────────────────────────────
  - name: mail
    bundles: [com.apple.mail]
    shortcuts:
      - {id: new_message,   keys: "cmd+n",        desc: "New message", say: [soạn thư mới, soạn email, thư mới, new message], expect: window}
      - {id: reply,         keys: "cmd+r",        desc: "Reply", say: [trả lời, trả lời thư, reply], expect: window}
      - {id: reply_all,     keys: "cmd+shift+r",  desc: "Reply all", say: [trả lời tất cả, reply all], expect: window}
      - {id: forward,       keys: "cmd+shift+f",  desc: "Forward", say: [chuyển tiếp, chuyển tiếp thư, forward], expect: window}
      - {id: send,          keys: "cmd+shift+d",  desc: "Send the message", say: [gửi thư, gửi email, send], risk: high, expect: window}
      - {id: get_mail,      keys: "cmd+shift+n",  desc: "Get new mail", say: [nhận thư mới, kiểm tra thư mới, get mail]}
      - {id: search,        keys: "cmd+alt+f",    desc: "Search mailbox", say: [tìm thư, tìm email, search mail]}
      - {id: attach,        keys: "cmd+shift+a",  desc: "Attach files…", say: [đính kèm file, attach file]}
      - {id: toggle_unread, keys: "cmd+shift+u",  desc: "Mark read / unread", say: [đánh dấu chưa đọc, mark unread]}
      - {id: delete,        keys: "cmd+delete",   desc: "Delete message", say: [xoá thư, xóa email, delete message], risk: high}

  # ── Notes / Preview ────────────────────────────────────────────────
  - name: notes
    bundles: [com.apple.Notes]
    shortcuts:
      - {id: new_note,      keys: "cmd+n",        desc: "New note", say: [ghi chú mới, tạo ghi chú, new note]}
      - {id: search,        keys: "cmd+alt+f",    desc: "Search all notes", say: [tìm ghi chú, search notes]}
      - {id: checklist,     keys: "cmd+shift+l",  desc: "Checklist", say: [tạo checklist, danh sách việc cần làm, checklist], when: text_focus}

  - name: preview
    bundles: [com.apple.Preview]
    shortcuts:
      - {id: rotate_left,   keys: "cmd+l",        desc: "Rotate left", say: [xoay trái, rotate left]}
      - {id: rotate_right,  keys: "cmd+r",        desc: "Rotate right", say: [xoay phải, rotate right]}
      - {id: markup,        keys: "cmd+shift+a",  desc: "Show markup toolbar", say: [công cụ đánh dấu, markup]}

  # ── Terminals ──────────────────────────────────────────────────────
  - name: terminal
    bundles: ["@terminal"]
    shortcuts:
      - {id: new_tab,       keys: "cmd+t",        desc: "New terminal tab", say: [tab mới, tab terminal mới, new tab], expect: window}
      - {id: new_window,    keys: "cmd+n",        desc: "New terminal window", say: [cửa sổ terminal mới, new window], expect: window}
      - {id: clear,         keys: "cmd+k",        desc: "Clear the screen", say: [xoá màn hình terminal, clear terminal, clear]}
      - {id: interrupt,     keys: "ctrl+c",       desc: "Interrupt the running command", say: [dừng lệnh đang chạy, ngắt lệnh, interrupt]}

  # ── Code editors (VS Code, Cursor) ─────────────────────────────────
  - name: editor
    bundles: ["@editor"]
    shortcuts:
      - {id: command_palette, keys: "cmd+shift+p", desc: "Command palette", say: [command palette, bảng lệnh]}
      - {id: quick_open,    keys: "cmd+p",        desc: "Quick open file", say: [mở nhanh file, quick open]}
      - {id: find_in_files, keys: "cmd+shift+f",  desc: "Search in all files", say: [tìm trong tất cả file, search in files]}
      - {id: terminal,      keys: "ctrl+`",       desc: "Toggle integrated terminal", say: [mở terminal tích hợp, toggle terminal]}
      - {id: sidebar,       keys: "cmd+b",        desc: "Toggle sidebar", say: [ẩn hiện thanh bên, toggle sidebar]}
      - {id: comment,       keys: "cmd+/",        desc: "Toggle line comment", say: [comment dòng, toggle comment]}
      - {id: format,        keys: "shift+alt+f",  desc: "Format document", say: [định dạng code, format document]}
      - {id: go_to_line,    keys: "ctrl+g",       desc: "Go to line", say: [đi tới dòng, go to line]}
      - {id: delete_line,   keys: "cmd+shift+k",  desc: "Delete line", say: [xoá dòng, xóa dòng, delete line]}
      - {id: split_editor,  keys: "cmd+\\",       desc: "Split editor", say: [chia đôi trình soạn thảo, split editor]}
      - {id: go_definition, keys: "f12",          desc: "Go to definition", say: [đi tới định nghĩa, go to definition]}

  # ── Office / iWork ─────────────────────────────────────────────────
  - name: office
    bundles: ["@office"]
    shortcuts:
      - {id: bold,          keys: "cmd+b",        desc: "Bold", say: [in đậm, bold]}
      - {id: italic,        keys: "cmd+i",        desc: "Italic", say: [in nghiêng, italic]}
      - {id: underline,     keys: "cmd+u",        desc: "Underline", say: [gạch chân, underline]}
      - {id: insert_link,   keys: "cmd+k",        desc: "Insert link", say: [chèn link, chèn liên kết, insert link]}

  - name: excel
    bundles: [com.microsoft.Excel]
    shortcuts:
      - {id: go_to,         keys: "ctrl+g",       desc: "Go to cell", say: [đi tới ô, go to cell]}
      - {id: autosum,       keys: "cmd+shift+t",  desc: "AutoSum", say: [tự động tính tổng, autosum, tính tổng]}
      - {id: fill_down,     keys: "cmd+d",        desc: "Fill down", say: [điền xuống, fill down]}
      - {id: fill_right,    keys: "cmd+r",        desc: "Fill right", say: [điền sang phải, fill right]}
      - {id: format_cells,  keys: "cmd+1",        desc: "Format cells", say: [định dạng ô, format cells]}
      - {id: select_column, keys: "ctrl+space",   desc: "Select column", say: [chọn cột, select column]}
      - {id: select_row,    keys: "shift+space",  desc: "Select row", say: [chọn hàng, chọn dòng, select row]}
      - {id: insert_date,   keys: "ctrl+;",       desc: "Insert today's date", say: [chèn ngày hôm nay, insert date]}

  # ── Chat apps ──────────────────────────────────────────────────────
  - name: chat
    bundles: ["@chat"]
    shortcuts:
      - {id: send,          keys: "return",       desc: "Send the typed message", say: [gửi tin nhắn, gửi tin, send message], risk: high}
      - {id: newline,       keys: "shift+return", desc: "New line in the message box", say: [xuống dòng, new line]}
      - {id: search,        keys: "cmd+f",        desc: "Search conversations", say: [tìm cuộc trò chuyện, tìm tin nhắn, search chat]}

  - name: slack
    bundles: [com.tinyspeck.slackmacgap]
    shortcuts:
      - {id: jump,          keys: "cmd+k",        desc: "Jump to a conversation", say: [chuyển cuộc trò chuyện, jump to]}
      - {id: dms,           keys: "cmd+shift+k",  desc: "Direct messages", say: [tin nhắn riêng, direct messages]}
      - {id: compose,       keys: "cmd+n",        desc: "Compose new message", say: [soạn tin mới, compose]}

macros:
  - id: finder_go_to
    bundles: [com.apple.finder]
    app: finder
    say: ["đi tới thư mục {path}", "go to folder {path}", "vào thư mục {path}"]
    param_rules: {path: "^[~/]"}
    desc: "Finder: open a folder by path"
    steps:
      - {hotkey: "cmd+shift+g"}
      - {wait: 0.6}
      - {type: "{path}"}
      - {wait: 0.3}
      - {press: return}
    expect: window

  - id: spotlight_open
    bundles: ["*"]
    say: ["spotlight {query}", "mở spotlight tìm {query}", "tìm bằng spotlight {query}"]
    desc: "Open something through Spotlight"
    steps:
      - {hotkey: "cmd+space"}
      - {wait: 0.5}
      - {type: "{query}"}
      - {wait: 0.8}
      - {press: return}
    expect: app

  - id: find_in_page
    bundles: ["*"]
    say: ["tìm trong trang {text}", "tìm chữ {text} trên trang", "find on page {text}", "tìm từ {text} trong trang"]
    desc: "Find text in the current page/document"
    steps:
      - {hotkey: "cmd+f"}
      - {wait: 0.4}
      - {type: "{text}"}
      - {press: return}

  - id: switch_tab
    bundles: ["@chromium"]
    app: chrome
    say: ["chuyển sang tab {title}", "chuyển tab {title}", "switch to tab {title}", "mở tab {title} đang mở"]
    desc: "Chrome: jump to an open tab by title"
    steps:
      - {hotkey: "cmd+shift+a"}
      - {wait: 0.6}
      - {type: "{title}"}
      - {wait: 0.5}
      - {press: return}
    expect: window

  - id: copy_all
    bundles: ["*"]
    say: ["copy toàn bộ", "sao chép toàn bộ", "copy tất cả", "sao chép tất cả nội dung", "copy all"]
    desc: "Select all and copy"
    steps:
      - {hotkey: "cmd+a"}
      - {hotkey: "cmd+c"}
      - {read_clipboard: true}
    expect: clipboard

  - id: read_selection
    bundles: ["*"]
    say: ["đọc đoạn đang chọn", "lấy đoạn đang chọn", "copy đoạn đang chọn", "read selection"]
    desc: "Copy the current selection and return its text"
    steps:
      - {hotkey: "cmd+c"}
      - {read_clipboard: true}
    expect: clipboard

  - id: export_pdf
    bundles: ["*"]
    say: ["xuất pdf", "xuất ra pdf", "xuất file pdf", "export pdf", "export as pdf", "lưu thành pdf"]
    desc: "Export the document as PDF through the File menu"
    steps:
      - {menu: [[File, Export as PDF…], [Tệp, Xuất dưới dạng PDF…], [File, Export to, PDF…], [Tệp, Xuất sang, PDF…]]}
