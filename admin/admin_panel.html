    <div v-if="providers.length>0" class="card">
      <div class="panel-title" style="margin-bottom:8px">{{t('prov_priority')}}</div>
      <div style="display:flex;align-items:center;gap:8px;padding:2px 14px;font-size:11px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border)">
        <span style="width:28px"></span><span style="width:28px"></span><span style="width:12px"></span>
        <span style="flex:1">Provider</span>
        <span style="min-width:55px;text-align:right">Latency</span>
        <span style="min-width:55px;text-align:right">Success</span>
        <span style="min-width:55px;text-align:right">Calls</span>
        <span style="width:32px"></span>
      </div>
      <div v-for="(p,i) in providers" :key="p.name" :style="{display:'flex',alignItems:'center',gap:'8px',padding:'6px 14px',marginBottom:'2px',opacity:p.enabled?1:0.35,background:i===0?'rgba(34,197,94,.03)':'transparent'}">
        <span style="font-size:12px;color:var(--muted);width:20px;text-align:center;font-family:var(--mono)" :style="{color:i===0?'#22c55e':'var(--muted)',fontWeight:i===0?700:400}">P{{i}}</span>
        <div style="display:flex;flex-direction:column;gap:1px">
          <button @click="moveProvider(p.name,'up')" :disabled="i===0" style="background:none;border:1px solid var(--border);color:var(--muted);width:18px;height:13px;font-size:9px;cursor:pointer;border-radius:2px">▲</button>
          <button @click="moveProvider(p.name,'down')" :disabled="i===providers.length-1" style="background:none;border:1px solid var(--border);color:var(--muted);width:18px;height:13px;font-size:9px;cursor:pointer;border-radius:2px">▼</button>
        </div>
        <span style="width:9px;height:9px;border-radius:50%;flex-shrink:0" :style="{background:p.has_key&&p.enabled?'#22c55e':!p.enabled?'#52525b':'#ef4444'}"></span>
        <div style="flex:1"><span style="font-size:13px;font-weight:500">{{p.name}}</span></div>
        <span style="font-size:11px;font-family:var(--mono);min-width:55px;text-align:right" :style="{color:(p.avg_latency_ms||0)<500?'#22c55e':(p.avg_latency_ms||0)<2000?'#eab308':'#ef4444'}">{{p.avg_latency_ms||0}}ms</span>
        <span style="font-size:11px;font-family:var(--mono);min-width:55px;text-align:right" :style="{color:(p.success_rate||1)>=0.8?'#22c55e':'#ef4444'}">{{((p.success_rate||1)*100).toFixed(0)}}%</span>
        <span style="font-size:11px;font-family:var(--mono);min-width:55px;text-align:right">{{p.total_calls||0}}</span>
        <!-- Toggle -->
        <label style="position:relative;display:inline-block;width:26px;height:13px;flex-shrink:0;cursor:pointer">
          <input type="checkbox" :checked="p.enabled" @change="toggleProvider(p.name,!p.enabled)" style="display:none"/>
          <span style="position:absolute;inset:0;border-radius:7px;transition:.2s;border:1px solid var(--border)" :style="{background:p.enabled?'rgba(34,197,94,.15)':'var(--bg3)',borderColor:p.enabled?'#22c55e':'var(--border)'}"></span>
          <span style="position:absolute;top:2px;width:7px;height:7px;border-radius:50%;transition:transform .2s" :style="{left:'2px',transform:p.enabled?'translateX(13px)':'none',background:p.enabled?'#22c55e':'var(--muted)'}"></span>
        </label>
        <button v-if="p.kind==='custom'" @click="removeCustom(p.name)" style="background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.3);font-size:12px;padding:2px 6px;cursor:pointer;border-radius:2px">✕</button>
      </div>
    </div>

    <!-- Fallback flow -->
    <div v-if="providers.filter(x=>x.enabled).length>0" class="card" style="padding:8px 14px">
      <b style="font-size:11px;font-family:var(--mono)">Fallback:</b>
      <template v-for="(p,i) in providers.filter(x=>x.enabled)" :key="p.name">
        <span style="border:1px solid;border-radius:2px;padding:2px 5px;font-size:11px;font-family:var(--mono);margin-left:4px" :style="{borderColor:p.has_key?'rgba(34,197,94,.2)':'var(--border)',color:p.has_key?'var(--bee)':'var(--muted)'}">{{p.name}}</span>
        <span v-if="i<providers.filter(x=>x.enabled).length-1" style="font-size:11px;color:var(--muted);margin-left:4px">→</span>
      </template>
    </div>

    <!-- AI Assistant -->
    <div class="card" style="border-color:rgba(167,139,250,.2)">
      <div class="panel-title">{{t('pv_ai_title')}}</div>
      <p style="font-size:12px;color:var(--muted);margin-bottom:10px">{{t('pv_ai_desc')}}</p>
      <button class="btn btn-bee" :disabled="aiLoading" @click="askAI">{{aiLoading?t('pv_ai_loading'):t('pv_ai_btn')}}</button>
      <div v-if="aiSuggestion" style="margin-top:10px;padding:10px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;font-size:13px;line-height:1.6;max-height:300px;overflow-y:auto" v-html="aiSuggestion.replace(/\\n/g,'<br>')"></div>
    </div>

    <!-- Budget Guard -->
    <div v-if="budget.length>0" class="card">
      <div class="panel-title">{{t('pv_budget_title')}}</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px">
        <div v-for="b in budget" :key="b.name" class="card" style="padding:8px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
            <span style="font-size:12px;font-weight:600;font-family:var(--mono)">{{b.name}}</span>
            <span class="badge badge-bee" style="font-size:10px">{{b.tier}}</span>
          </div>
          <div style="height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-bottom:4px">
            <div style="height:100%;border-radius:3px;transition:width .3s" :style="{width:Math.min(b.usage_pct,100)+'%',background:b.usage_pct>80?'#ef4444':b.usage_pct>50?'#eab308':'#22c55e'}"></div>
          </div>
          <div style="display:flex;gap:8px;font-size:11px;color:var(--muted);flex-wrap:wrap">
            <span>{{b.total_calls}} calls</span>
            <span>{{b.rpm_limit}} RPM</span>
            <span v-if="b.est_cost_usd>0">{{'$'+b.est_cost_usd.toFixed(4)}}</span>
            <span v-if="b.warning" style="color:#eab308;font-weight:600">{{b.warning}}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Logs -->
    <div v-if="logs.length>0" class="card">
      <div class="panel-title">{{t('pv_log_title')}}</div>
      <div style="max-height:200px;overflow-y:auto">
        <div v-for="(l,i) in logs" :key="i" style="display:flex;align-items:center;gap:8px;padding:3px 6px;border-bottom:1px solid var(--border);font-size:12px;font-family:var(--mono)" :style="{background:l.success?'transparent':'rgba(239,68,68,.03)'}">
          <span style="color:var(--muted);min-width:60px">{{fmtT(l.ts)}}</span>
          <span style="min-width:120px;font-weight:500">{{l.provider}}</span>
          <span :style="{color:l.success?'#22c55e':'#ef4444'}">{{l.success?'✓':'✗'}}</span>
          <span style="min-width:45px;text-align:right;color:var(--muted)">{{l.latency_ms}}ms</span>
          <span v-if="l.error" style="color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px">{{l.error}}</span>
        </div>
      </div>
    </div>

    <!-- Import -->
    <div class="card">
      <div class="panel-title">📥 Import Config</div>
      <textarea class="inp" v-model="importText" placeholder="Paste JSON config..." style="width:100%;min-height:60px;font-family:var(--mono);font-size:12px;resize:vertical"></textarea>
      <div style="display:flex;gap:6px;margin-top:6px;align-items:center">
        <button class="btn btn-bee" :disabled="!importText.trim()" @click="doImport" style="font-size:13px">Import</button>
        <span v-if="importMsg" style="font-size:13px" :style="{color:importMsg.startsWith('✅')?'var(--bee)':'var(--danger)'}">{{importMsg}}</span>
      </div>
    </div>

    <div v-if="providers.length===0" style="padding:16px;text-align:center;color:var(--muted)">{{t('sp_loading')}}</div>
  </div>`
}


// ── Chrome Swarm ──────────────────────────────────────────────
const ChromeView = {
  setup() {
    const bee=useBeeStore(), search=ref(''), launching=ref(null), msg=ref('')
    onMounted(()=>bee.fetchChromeProfiles())
    const filtered=computed(()=>bee.chromeProfiles.filter(p=>!search.value||p.name.toLowerCase().includes(search.value.toLowerCase())))
    async function launch(name) {
      launching.value=name; msg.value=''
      try { await api.post('/api/v2/chrome/profiles/open',{name}); msg.value=t('ch_opening')+' '+name } catch { msg.value=t('ch_err_open')+' '+name }
      setTimeout(()=>{launching.value=null;msg.value=''},2500)
    }
    return { bee, search, filtered, launching, msg, launch }
  },
  template:`
  <div>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
      <h2 style="font-size:18px;font-weight:700">{{t('title_chrome')}}</h2>
      <span class="badge badge-bee">{{bee.chromeTotal}} profiles</span>
      <input class="inp" v-model="search" :placeholder="t('ch_find')" style="width:220px;margin-left:auto"/>
    </div>
    <div v-if="msg" class="glass" style="padding:10px 14px;margin-bottom:12px;font-size:15px">{{msg}}</div>
    <div v-if="!bee.chromeProfiles.length" style="color:var(--muted);padding:40px;text-align:center">Chưa có Chrome profiles. Cấu hình AppScanner trong config.yaml.</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px">
      <div v-for="p in filtered" :key="p.name" class="card" style="text-align:center;padding:14px">
        <div style="width:40px;height:40px;border-radius:50%;background:var(--bee);color:#000;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px">{{p.name[0]?.toUpperCase()}}</div>
        <div style="font-weight:600;font-size:14px;margin-bottom:4px">{{p.name}}</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:10px;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{p.directory}}</div>
        <button class="btn btn-bee" :disabled="launching===p.name" @click="launch(p.name)" style="width:100%;font-size:13px">{{launching===p.name?'⏳':'▶ Open'}}</button>
      </div>
    </div>
  </div>`
}

// ── Memory ────────────────────────────────────────────────────
const MemoryView = {
  setup() {
    const bee=useBeeStore(), tab=ref('rag'), q=ref(''), results=ref([]), searching=ref(false)
    const ragStats=ref({}), ragQuery=ref(''), ragResults=ref([]), ragSearching=ref(false)
    const ragCollection=ref('task_history'), addTopic=ref(''), addContent=ref(''), addMsg=ref('')
    const contextGoal=ref(''), contextPreview=ref('')

    onMounted(async()=>{
      bee.fetchFailureMemory();bee.fetchWorkflowLibrary()
      try{ const r=await api.get('/api/v2/rag/stats'); ragStats.value=r.data }catch{}
    })
    async function search() {
      if(!q.value.trim()) return; searching.value=true
      try { const r=await api.post('/api/v2/memory/semantic/search',{query:q.value}); results.value=r.data.results||[] } catch { results.value=[] } finally { searching.value=false }
    }
    async function ragSearch() {
      if(!ragQuery.value.trim()) return; ragSearching.value=true; ragResults.value=[]
      try{ const r=await api.get('/api/v2/rag/search?q='+encodeURIComponent(ragQuery.value)+'&collection='+ragCollection.value+'&k=10'); ragResults.value=r.data?.results||[] }catch{} ragSearching.value=false
    }
    async function addKnowledge() {
      if(!addTopic.value.trim()||!addContent.value.trim()) return
      try{ await api.post('/api/v2/rag/add-knowledge',{topic:addTopic.value,content:addContent.value}); addMsg.value='✅ Added!'; addTopic.value=''; addContent.value=''; setTimeout(()=>{addMsg.value=''},2000) }catch(e){ addMsg.value='❌ '+e.message }
    }
    async function previewContext() {
      if(!contextGoal.value.trim()) return
      try{ const r=await api.get('/api/v2/rag/context?goal='+encodeURIComponent(contextGoal.value)); contextPreview.value=r.data?.context||'(no context)' }catch{ contextPreview.value='Error' }
    }
    return { bee, tab, q, results, searching, search,
             ragStats, ragQuery, ragResults, ragSearching, ragCollection, ragSearch,
             addTopic, addContent, addMsg, addKnowledge,
             contextGoal, contextPreview, previewContext }
  },
  template:`
  <div>
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <button v-for="t in [{k:'rag',l:'🧠 RAG Memory'},{k:'failure',l:'💔 Failure'},{k:'workflow',l:'📋 Workflow'},{k:'semantic',l:'🔍 Semantic'}]" :key="t.k" class="btn" :class="tab===t.k?'btn-bee':'btn-ghost'" @click="tab=t.k">{{t.l}}</button>
    </div>

    <!-- RAG Memory -->
    <div v-if="tab==='rag'">
      <!-- Stats -->
      <div class="card" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
        <div>
          <div style="font-size:13px;font-weight:700">🧠 RAG Memory Engine</div>
          <div style="font-size:11px;color:var(--muted)">Backend: {{ragStats.backend||'—'}} · {{ragStats.ready?'🟢 Ready':'🔴 Not ready'}}</div>
        </div>
        <div v-for="(count,name) in (ragStats.collections||{})" :key="name" class="stat-card" style="padding:8px 12px;min-width:80px">
          <div class="stat-val" style="font-size:20px">{{count}}</div>
          <div class="stat-label" style="font-size:11px">{{name}}</div>
        </div>
      </div>

      <!-- Search RAG -->
      <div class="card" style="margin-bottom:12px">
        <div style="font-size:14px;font-weight:700;margin-bottom:8px">{{t('mm_search_title')}}</div>
        <div style="display:flex;gap:6px;margin-bottom:8px">
          <select class="inp" v-model="ragCollection" style="font-size:12px;padding:5px;width:140px">
            <option value="task_history">📋 Task History</option>
            <option value="knowledge_base">📚 Knowledge</option>
            <option value="conversations">💬 Conversations</option>
          </select>
          <input class="inp" v-model="ragQuery" :placeholder="t('mm_search_ph')" @keydown.enter="ragSearch" style="flex:1;font-size:13px"/>
          <button class="btn btn-bee" :disabled="ragSearching" @click="ragSearch" style="font-size:12px">{{ragSearching?'⏳':'🔍'}}</button>
        </div>
        <div v-if="ragResults.length" style="max-height:300px;overflow-y:auto">
          <div v-for="(r,i) in ragResults" :key="i" style="padding:8px 10px;margin-bottom:4px;border:1px solid var(--border);border-radius:4px;font-size:12px">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
              <span v-if="r.success!==undefined" :style="{color:r.success?'#22c55e':'#ef4444'}">{{r.success?'✅':'❌'}}</span>
              <span style="font-weight:600;flex:1">{{r.goal||r.topic||r.user_msg||'—'}}</span>
              <span style="color:var(--bee);font-family:var(--mono);font-size:11px">{{(r.score*100).toFixed(0)}}%</span>
            </div>
            <div v-if="r.skill||r.lane" style="font-size:11px;color:var(--muted)">{{r.skill}} · {{r.lane}} · {{r.duration_s}}s · {{r.steps_count}} steps</div>
            <div v-if="r.text" style="font-size:11px;color:var(--txt2);margin-top:3px;max-height:60px;overflow:hidden">{{r.text}}</div>
          </div>
        </div>
        <div v-if="!ragResults.length&&ragQuery" style="font-size:12px;color:var(--muted);padding:12px 0;text-align:center">{{t('mm_no_results')}}</div>
      </div>

      <!-- Context Preview -->
      <div class="card" style="margin-bottom:12px">
        <div style="font-size:14px;font-weight:700;margin-bottom:8px">🎯 Preview RAG Context</div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px">{{t('mm_preview_desc')}}</div>
        <div style="display:flex;gap:6px;margin-bottom:8px">
          <input class="inp" v-model="contextGoal" :placeholder="t('mm_goal_ph')" @keydown.enter="previewContext" style="flex:1;font-size:13px"/>
          <button class="btn btn-bee" @click="previewContext" style="font-size:12px">👁️ Preview</button>
        </div>
        <pre v-if="contextPreview" style="background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:10px;font-size:12px;font-family:var(--mono);white-space:pre-wrap;max-height:200px;overflow-y:auto;color:var(--txt2)">{{contextPreview}}</pre>
      </div>

      <!-- Add Knowledge -->
      <div class="card">
        <div style="font-size:14px;font-weight:700;margin-bottom:8px">{{t('mm_add_title')}}</div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px">{{t('mm_add_desc')}}</div>
        <input class="inp" v-model="addTopic" :placeholder="t('mm_topic_ph')" style="width:100%;font-size:13px;margin-bottom:4px"/>
        <textarea class="inp" v-model="addContent" rows="3" :placeholder="t('mm_content_ph')" style="width:100%;font-size:13px;resize:vertical;margin-bottom:6px"></textarea>
        <div style="display:flex;gap:6px;align-items:center">
          <button class="btn btn-bee" @click="addKnowledge" :disabled="!addTopic.trim()||!addContent.trim()" style="font-size:12px">➕ Thêm vào Knowledge Base</button>
          <span v-if="addMsg" style="font-size:12px" :style="{color:addMsg.startsWith('✅')?'var(--bee)':'var(--danger)'}">{{addMsg}}</span>
        </div>
      </div>
    </div>

    <div v-if="tab==='failure'" class="card">
      <div class="panel-title">💔 Failure Memory — {{bee.failureRecords.length}} records</div>
      <div v-if="!bee.failureRecords.length" style="color:var(--muted);font-size:14px">{{t('mm_failure_hint')}}</div>
      <div v-for="(r,i) in bee.failureRecords.slice(0,20)" :key="i" style="padding:8px 0;border-bottom:1px solid var(--border);font-size:14px">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:3px">
          <span class="badge badge-danger" style="font-size:12px">{{r.error_type}}</span>
          <span style="color:var(--muted)">{{new Date(r.t*1000).toLocaleTimeString('vi-VN')}}</span>
        </div>
        <div style="color:var(--txt2)">{{r.goal}}</div>

// OpenClawStoreView — 🦞 OpenClaw Skill Store + Security Review
// ══════════════════════════════════════════════════════════════
const OpenClawStoreView = {
  setup() {
    const searchQ = ref('')
    const searchResults = ref([])
    const trending = ref([])
    const installed = ref([])
    const pending = ref([])
    const searching = ref(false)
    const tab = ref('browse') // browse | installed | pending
    const scanningSkill = ref('')
    const scanResult = ref(null)
    const msg = ref('')
    const selectedSkill = ref(null)

    async function fetchAll() {
      try { const r=await api.get('/api/v2/openclaw/installed'); installed.value=r.data?.skills||[] } catch{}
      try { const r=await api.get('/api/v2/openclaw/pending'); pending.value=r.data?.skills||[] } catch{}
      try { const r=await api.get('/api/v2/openclaw/trending'); trending.value=r.data?.skills||[] } catch{}
    }

    async function search() {
      if (!searchQ.value.trim()) return
      searching.value=true; searchResults.value=[]
      try {
        const r=await api.get('/api/v2/openclaw/search?q='+encodeURIComponent(searchQ.value)+'&limit=20')
        searchResults.value=r.data?.skills||[]
      } catch(e) { msg.value='❌ '+e.message }
      searching.value=false
    }

    async function downloadAndScan(skill) {
      scanningSkill.value=skill.name; scanResult.value=null; msg.value='📥 Downloading...'
      try {
        // 1. Download to quarantine
        const dl=await api.post('/api/v2/openclaw/download',{name:skill.name,version:skill.version||'latest',metadata:skill})
        if (!dl.data?.ok) { msg.value='❌ Download failed'; scanningSkill.value=''; return }
        msg.value='🛡️ Running 5-gate security scan...'
        // 2. Run security pipeline
        const sc=await api.post('/api/v2/openclaw/security-scan',{quarantine_path:dl.data.quarantine_path,name:skill.name})
        scanResult.value=sc.data
        selectedSkill.value={...skill, quarantine_path:dl.data.quarantine_path, security:sc.data}
        msg.value=sc.data?.passed?'✅ All gates passed!':'⚠️ Review required'
        await fetchAll()
      } catch(e) { msg.value='❌ Error: '+e.message }
      scanningSkill.value=''
    }

    async function approveSkill(skill) {
      try {
        await api.post('/api/v2/openclaw/approve',{name:skill.name,security_result:skill.security||scanResult.value||{}})
        msg.value='✅ Installed!'; selectedSkill.value=null; scanResult.value=null
        await fetchAll()
      } catch(e) { msg.value='❌ '+e.message }
    }

    async function rejectSkill(name,reason) {
      try {
        await api.post('/api/v2/openclaw/reject',{name,reason:reason||'Admin rejected'})
        msg.value='❌ Rejected'; selectedSkill.value=null; scanResult.value=null
        await fetchAll()
      } catch(e) { msg.value='❌ '+e.message }
    }

    async function uninstallSkill(name) {
      if (!confirm(t('oc_uninstall_confirm')+' "'+name+'"?')) return
      try { await api.post('/api/v2/openclaw/uninstall',{name}); await fetchAll() } catch{}
    }

    async function toggleSkill(name,enabled) {
      try { await api.post('/api/v2/openclaw/toggle',{name,enabled}); await fetchAll() } catch{}
    }

    function gateIcon(passed,skipped) { return skipped?'⏭️':passed?'✅':'❌' }
    function gateColor(passed,skipped) { return skipped?'var(--muted)':passed?'#22c55e':'#ef4444' }
    function scoreColor(s) { return s>=80?'#22c55e':s>=50?'#eab308':'#ef4444' }

    onMounted(fetchAll)
    return {
      t,currentLang,searchQ,searchResults,trending,installed,pending,searching,tab,
      scanningSkill,scanResult,msg,selectedSkill,
      search,downloadAndScan,approveSkill,rejectSkill,uninstallSkill,toggleSkill,fetchAll,
      gateIcon,gateColor,scoreColor
    }
  },
  template: `
  <div style="display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <h2 style="font-size:19px;font-weight:700">{{t('title_openclaw')}}</h2>
      <span style="font-size:12px;color:var(--muted)">{{t('oc_subtitle')}}</span>
      <span v-if="msg" style="margin-left:auto;font-size:12px" :style="{color:msg.startsWith('✅')?'var(--bee)':msg.startsWith('❌')?'var(--danger)':'var(--info)'}">{{msg}}</span>
    </div>

    <!-- Tabs -->
    <div style="display:flex;gap:6px">
      <button class="btn" :class="tab==='browse'?'btn-bee':'btn-ghost'" @click="tab='browse'" style="font-size:13px">{{t('oc_tab_browse')}} ({{searchResults.length||trending.length}})</button>
      <button class="btn" :class="tab==='pending'?'btn-bee':'btn-ghost'" @click="tab='pending'" style="font-size:13px">{{t('oc_tab_pending')}} ({{pending.length}})</button>
      <button class="btn" :class="tab==='installed'?'btn-bee':'btn-ghost'" @click="tab='installed'" style="font-size:13px">{{t('oc_tab_installed')}} ({{installed.length}})</button>
    </div>

    <!-- BROWSE TAB -->
    <div v-if="tab==='browse'">
      <!-- Search -->
      <div class="card" style="display:flex;gap:8px;align-items:center">
        <input class="inp" v-model="searchQ" placeholder="Search skills... email, research, automation, social..." @keydown.enter="search" style="flex:1;font-size:14px"/>
        <button class="btn btn-bee" :disabled="searching||!searchQ.trim()" @click="search" style="font-size:13px">{{searching?'⏳':'🔍 Search'}}</button>
      </div>
      <!-- Results or Trending -->
      <div class="card">
        <div style="font-size:14px;font-weight:700;margin-bottom:8px">{{searchResults.length?t('oc_results')+' ('+searchResults.length+')':t('oc_trending')}}</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px">
          <div v-for="s in (searchResults.length?searchResults:trending)" :key="s.name"
            class="card" style="padding:10px;transition:all .15s" @mouseenter="$event.currentTarget.style.borderColor='rgba(34,197,94,.3)'" @mouseleave="$event.currentTarget.style.borderColor='var(--border)'">
            <div style="display:flex;align-items:start;gap:8px;margin-bottom:6px">
              <span style="font-size:20px">{{s.emoji||'📦'}}</span>
              <div style="flex:1;min-width:0">
                <div style="font-size:14px;font-weight:700">{{s.name}}</div>
                <div style="font-size:11px;color:var(--muted)">by {{s.author}} · v{{s.version}}</div>
              </div>
              <div style="text-align:right">
                <div style="font-size:12px;color:#eab308">★ {{s.stars}}</div>
                <div style="font-size:10px;color:var(--muted)">{{s.downloads}} ↓</div>
              </div>
            </div>
            <div style="font-size:12px;color:var(--txt2);margin-bottom:8px;max-height:40px;overflow:hidden">{{s.description}}</div>
            <div style="display:flex;gap:4px">
              <button class="btn btn-bee" :disabled="scanningSkill===s.name" @click="downloadAndScan(s)" style="font-size:11px;padding:4px 10px">
                {{scanningSkill===s.name?t('oc_scanning'):t('oc_install_review')}}
              </button>
            </div>
          </div>
        </div>
        <div v-if="!searchResults.length&&!trending.length" style="text-align:center;padding:30px;color:var(--muted);font-size:13px">
          {{t('oc_search_hint')}}
        </div>
      </div>
    </div>

    <!-- PENDING REVIEW TAB -->
    <div v-if="tab==='pending'">
      <div v-if="!pending.length" class="card" style="text-align:center;padding:30px;color:var(--muted)">
        {{t('oc_no_pending')}}
      </div>
      <div v-for="p in pending" :key="p.name" class="card" style="border-color:rgba(234,179,8,.3)">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <span style="font-size:18px">{{p.emoji||'📦'}}</span>
          <div style="flex:1"><b style="font-size:14px">{{p.name}}</b><br/><span style="font-size:11px;color:var(--muted)">{{t('oc_queued')}} {{new Date(p.queued_at*1000).toLocaleString({vi:'vi-VN',en:'en-US',zh:'zh-CN',ko:'ko-KR'}[currentLang]||'en-US')}}</span></div>
          <button class="btn btn-bee" @click="downloadAndScan({name:p.name,quarantine_path:p.quarantine_path})" style="font-size:11px">{{t('oc_run_scan')}}</button>
        </div>
      </div>
    </div>

    <!-- SECURITY REVIEW PANEL (overlay) -->
    <div v-if="scanResult" class="card" style="border-color:rgba(225,29,72,.3);background:var(--bg2)">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div style="font-size:16px;font-weight:700">{{t('oc_security_title')}} — {{selectedSkill?.name||'Skill'}}</div>
        <button @click="scanResult=null;selectedSkill=null" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px">✕</button>
      </div>
      <!-- Score -->
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:10px;background:var(--bg);border-radius:6px">

const TrainingView = {
  setup() {
    const tab = ref('data')
    const domain = ref('')
    const teacher = ref('gemini-2.0-flash')
    const sampleCount = ref(1000)
    const dataset = ref([])
    const dataStats = ref(null)
    const generating = ref(false)
    const genProgress = ref('')
    const trainMethod = ref('lora_mlx')
    const trainEpochs = ref(3)
    const trainLR = ref('2e-4')
    const training = ref(false)
    const trainLog = ref([])
    const trainProgress = ref(0)
    const trainedModels = ref([])
    const promptLab = ref({
      current: '',
      variants: [],
      testing: false,
    })

    async function generateDataset() {
      if (!domain.value.trim()) return
      generating.value = true
      genProgress.value = t('tr_gen_hint')
      try {
        const r = await api.post('/api/v2/training/generate', {
          domain: domain.value,
          teacher: teacher.value,
          count: sampleCount.value,
        })
        if (r.data?.ok) {
          genProgress.value = '✅ ' + (r.data.generated || 0) + ' samples'
          await fetchStats()
        }
      } catch(e) { genProgress.value = '❌ ' + e.message }
      generating.value = false
    }

    async function fetchStats() {
      try {
        const r = await api.get('/api/v2/training/stats')
        dataStats.value = r.data
      } catch {}
    }

    async function startTraining() {
      training.value = true
      trainLog.value = ['Starting ' + trainMethod.value + '...']
      trainProgress.value = 0
      try {
        const r = await api.post('/api/v2/training/start', {
          method: trainMethod.value,
          epochs: trainEpochs.value,
          lr: trainLR.value,
        })
        if (r.data?.ok) {
          trainLog.value.push('✅ Training started: ' + r.data.job_id)
          pollTraining(r.data.job_id)
        }
      } catch(e) { trainLog.value.push('❌ ' + e.message); training.value = false }
    }

    async function pollTraining(jobId) {
      const interval = setInterval(async () => {
        try {
          const r = await api.get('/api/v2/training/status/' + jobId)
          trainProgress.value = r.data?.progress || 0
          if (r.data?.log) trainLog.value = r.data.log
          if (r.data?.status === 'done' || r.data?.status === 'error') {
            clearInterval(interval)
            training.value = false
            await fetchModels()
          }
        } catch { clearInterval(interval); training.value = false }
      }, 5000)
    }

    async function fetchModels() {
      try {
        const r = await api.get('/api/v2/training/models')
        trainedModels.value = r.data?.models || []
      } catch {}
    }

    async function deployModel(model) {
      try {
        await api.post('/api/v2/training/deploy', { model_path: model.path })
        model.deployed = true
      } catch(e) { alert('❌ ' + e.message) }
    }

    onMounted(() => { fetchStats(); fetchModels() })
    return {
      t, tab, domain, teacher, sampleCount, dataset, dataStats,
      generating, genProgress, generateDataset, fetchStats,
      trainMethod, trainEpochs, trainLR, training, trainLog, trainProgress,
      startTraining, trainedModels, deployModel, promptLab,
    }
  },

const SchedulerView = {

    const tzOffset = ref('+07:00')
    const now = ref(new Date())
    const editingTask = ref(null)
    const showAdd = ref(false)
    const saveMsg = ref('')
    const historyLog = ref([])
    const viewMode = ref('week') // 'day' | 'week'
    const selectedDay = ref(new Date().getDay()) // 0=Sun..6=Sat

    const TIMEZONES = [
      {tz:'Pacific/Honolulu',label:'Hawaii (UTC-10)',offset:'-10:00'},
      {tz:'America/Los_Angeles',label:'Los Angeles (UTC-8)',offset:'-08:00'},
      {tz:'America/New_York',label:'New York (UTC-5)',offset:'-05:00'},
      {tz:'Europe/London',label:'London (UTC+0)',offset:'+00:00'},
      {tz:'Europe/Paris',label:'Paris (UTC+1)',offset:'+01:00'},
      {tz:'Europe/Moscow',label:'Moscow (UTC+3)',offset:'+03:00'},
      {tz:'Asia/Dubai',label:'Dubai (UTC+4)',offset:'+04:00'},
      {tz:'Asia/Kolkata',label:'India (UTC+5:30)',offset:'+05:30'},
      {tz:'Asia/Bangkok',label:'Bangkok (UTC+7)',offset:'+07:00'},
      {tz:'Asia/Ho_Chi_Minh',label:'Việt Nam (UTC+7)',offset:'+07:00'},
      {tz:'Asia/Singapore',label:'Singapore (UTC+8)',offset:'+08:00'},
      {tz:'Asia/Shanghai',label:'China (UTC+8)',offset:'+08:00'},
      {tz:'Asia/Tokyo',label:'Japan (UTC+9)',offset:'+09:00'},
      {tz:'Asia/Seoul',label:'Korea (UTC+9)',offset:'+09:00'},
      {tz:'Australia/Sydney',label:'Sydney (UTC+11)',offset:'+11:00'},
    ]

    const DAYS = ['CN','T2','T3','T4','T5','T6','T7']
    const DAY_NAMES = computed(()=>t('sc_daynames').split(','))
    const HOURS = Array.from({length:24}, (_,i) => (i<10?'0':'')+i+':00')

    const REPEAT_OPTIONS = computed(()=>[
      {value:'once', label:'Một lần'},
      {value:'daily', label:'Hàng ngày'},
      {value:'weekdays', label:'Thứ 2-6'},
      {value:'weekly', label:'Hàng tuần'},
      {value:'custom', label:'Tùy chỉnh'},
    ])

    const TASK_SOURCES = [
      {value:'workflow', label:t('sc_wf_type'), icon:'🎓'},
      {value:'skill', label:t('sc_skill_type'), icon:'⚡'},
      {value:'command', label:t('sc_cmd_type'), icon:'⌨️'},
    ]

    // New task form
    const newTask = reactive({
      name: '',
      source: 'command',
      workflow_id: '',
      skill_name: '',
      command: '',
      time: '09:00',
      repeat: 'daily',
      days: [1,2,3,4,5], // Mon-Fri default
      enabled: true,
      priority: 'normal', // low | normal | high
      notify: true,
    })

    function resetForm() {
      newTask.name=''; newTask.source='command'; newTask.workflow_id=''
      newTask.skill_name=''; newTask.command=''; newTask.time='09:00'
      newTask.repeat='daily'; newTask.days=[1,2,3,4,5]; newTask.enabled=true
      newTask.priority='normal'; newTask.notify=true
      editingTask.value=null
    }

    function toggleDay(d) {
      const idx = newTask.days.indexOf(d)
      if (idx>=0) newTask.days.splice(idx,1)
      else newTask.days.push(d)
      newTask.days.sort()
    }

    async function fetchAll() {
      try { const r=await api.get('/api/v2/scheduler/list'); schedules.value=r.data?.schedules||[]; timezone.value=r.data?.timezone||'Asia/Ho_Chi_Minh' } catch {}
      try { const r=await api.get('/api/v2/workflow-teacher/list'); workflows.value=r.data?.workflows||[] } catch {}
      try { const r=await api.get('/api/v2/skill/registry'); skills.value=r.data?.skills||[] } catch {}
      try { const r=await api.get('/api/v2/scheduler/history?limit=30'); historyLog.value=r.data?.history||[] } catch {}
    }

    async function saveTimezone() {
      try { await api.post('/api/v2/scheduler/timezone', {timezone: timezone.value}); saveMsg.value='✅ Timezone saved' } catch { saveMsg.value='❌ Error' }
      setTimeout(()=>{saveMsg.value=''},2000)
    }

    async function addOrUpdateTask() {
      if (!newTask.name && !newTask.command && !newTask.workflow_id) return
      const task = {
        id: editingTask.value?.id || ('sched_'+Date.now()),
        name: newTask.name || newTask.command?.slice(0,40) || 'Task',
        source: newTask.source,
        workflow_id: newTask.workflow_id,
        skill_name: newTask.skill_name,
        command: newTask.command,
        time: newTask.time,
        repeat: newTask.repeat,
        days: newTask.repeat==='custom' ? newTask.days : newTask.repeat==='daily' ? [0,1,2,3,4,5,6] : newTask.repeat==='weekdays' ? [1,2,3,4,5] : newTask.repeat==='weekly' ? [new Date().getDay()] : [],
        enabled: newTask.enabled,
        priority: newTask.priority,
        notify: newTask.notify,
      }
      try {
        await api.post('/api/v2/scheduler/save', {task})
        showAdd.value=false; resetForm(); await fetchAll()
        saveMsg.value='✅'; setTimeout(()=>{saveMsg.value=''},1500)
      } catch (e) { saveMsg.value='❌ '+(e.message||'Error') }
    }

    function editTask(t) {
      editingTask.value = t
      newTask.name=t.name; newTask.source=t.source||'command'
      newTask.workflow_id=t.workflow_id||''; newTask.skill_name=t.skill_name||''
      newTask.command=t.command||''; newTask.time=t.time||'09:00'
      newTask.repeat=t.repeat||'daily'; newTask.days=[...(t.days||[])]
      newTask.enabled=t.enabled!==false; newTask.priority=t.priority||'normal'
      newTask.notify=t.notify!==false
      showAdd.value=true
    }

    async function deleteTask(id) {
      if (!confirm(t('sc_confirm_del'))) return
      try { await api.post('/api/v2/scheduler/delete',{id}) } catch {}
      await fetchAll()
    }

    async function toggleTask(t) {
      t.enabled=!t.enabled
      try { await api.post('/api/v2/scheduler/save',{task:t}) } catch {}
      await fetchAll()
    }

    async function runNow(t) {
      try { await api.post('/api/v2/scheduler/run-now',{id:t.id}); saveMsg.value='▶ Đang chạy...'; setTimeout(()=>{saveMsg.value=''},2000) } catch {}
    }

    // Group schedules by time for timeline view
    function schedulesForDay(dayIdx) {
      return schedules.value.filter(s => s.enabled!==false && (s.days||[]).includes(dayIdx)).sort((a,b) => (a.time||'').localeCompare(b.time||''))
    }

    function taskIcon(t) {
      if (t.source==='workflow') return '🎓'
      if (t.source==='skill') return '⚡'
      return '⌨️'
    }

    function priorityColor(p) {
      if (p==='high') return '#ef4444'
      if (p==='low') return '#6b7280'
      return '#22c55e'
    }

    function repeatLabel(r) {
      return REPEAT_OPTIONS.value.find(o=>o.value===r)?.label||r
    }

    // Clock
    let clockTimer=null
    onMounted(async()=>{ await fetchAll(); clockTimer=setInterval(()=>{now.value=new Date()},1000) })
    onUnmounted(()=>clearInterval(clockTimer))

    const currentTime = computed(()=>{
      try{ return now.value.toLocaleTimeString('vi-VN',{timeZone:timezone.value,hour:'2-digit',minute:'2-digit',second:'2-digit'}) }catch{ return now.value.toLocaleTimeString('vi-VN') }
    })
    const currentDate = computed(()=>{
      try{ return now.value.toLocaleDateString('vi-VN',{timeZone:timezone.value,weekday:'long',day:'numeric',month:'long',year:'numeric'}) }catch{ return now.value.toLocaleDateString('vi-VN') }
    })
    const todaySchedules = computed(()=> schedulesForDay(now.value.getDay()))
    const nextTask = computed(()=>{
      const curTime=currentTime.value?.slice(0,5)||'00:00'
      return todaySchedules.value.find(s=>(s.time||'')>=curTime)
    })

    return {
      schedules,workflows,skills,timezone,tzOffset,now,editingTask,showAdd,saveMsg,historyLog,viewMode,selectedDay,
      TIMEZONES,DAYS,DAY_NAMES,HOURS,REPEAT_OPTIONS,TASK_SOURCES,
      newTask,resetForm,toggleDay,fetchAll,saveTimezone,addOrUpdateTask,editTask,deleteTask,toggleTask,runNow,
      schedulesForDay,taskIcon,priorityColor,repeatLabel,
      currentTime,currentDate,todaySchedules,nextTask
    }
  },
  template: `

// ── God Mode ──────────────────────────────────────────────────
const GodModeView = {
  setup() {
    const bee=useBeeStore(), bulk=ref(''), running=ref(false), confirm=ref(false), done=ref(false)
    async function runBulk() {
      const goals=bulk.value.split('\n').map(g=>g.trim()).filter(Boolean); if(!goals.length) return
      running.value=true
      for(const g of goals){await api.post('/api/v2/task/run',{goal:g}).catch(()=>{});await new Promise(r=>setTimeout(r,500))}
      running.value=false; bulk.value=''
    }
    async function doReset() { await bee.godReset(); confirm.value=false; done.value=true; setTimeout(()=>{done.value=false},3000) }
    return { bulk, running, confirm, done, doReset, runBulk }
  },
  template:`
  <div class="g2">
    <div class="card">
      <div class="panel-title">🚀 Bulk Task Runner</div>
      <p style="font-size:14px;color:var(--muted);margin-bottom:10px">{{t('gm_desc')}}</p>
      <textarea class="inp" v-model="bulk" rows="6" placeholder="mở chrome profile 00Fujin&#10;tổng hợp dữ liệu tồn kho&#10;gửi báo cáo qua telegram" style="resize:none;margin-bottom:8px"></textarea>
      <button class="btn btn-bee" :disabled="running||!bulk.trim()" @click="runBulk">{{running?t('gm_running'):t('gm_run')}}</button>
    </div>
    <div class="card">
      <div class="panel-title">🔄 System Reset</div>
      <div style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:4px;padding:12px;font-size:14px;color:var(--txt2);margin-bottom:12px">
        {{t('gm_reset_warn')}}<br>{{t('gm_reset_keep')}}
      </div>
      <div v-if="done" class="badge badge-ok" style="padding:8px 12px;margin-bottom:10px;display:block">{{t('gm_reset_done')}}</div>
      <button v-if="!confirm" class="btn btn-danger" @click="confirm=true">{{t('btn_god_reset')}}</button>
      <div v-else style="display:flex;gap:8px;align-items:center">
        <span style="font-size:14px;color:var(--warn)">{{t('gm_confirm')}}</span>
        <button class="btn btn-danger" @click="doReset">{{t('gm_confirm_btn')}}</button>
        <button class="btn btn-ghost" @click="confirm=false">{{t('btn_cancel')}}</button>
      </div>
    </div>
  </div>`
}

// ── Task Graph ────────────────────────────────────────────────
const TaskGraphView = {
  setup() {
    const graphData=ref({nodes:[],edges:[]}), selected=ref(null), stats=ref({total:0,done:0,failed:0,healed:0,replanned:0})
    let t
    async function fetch() {
      try {
        const r=await api.get('/api/v2/task/graph')
        graphData.value=r.data||{nodes:[],edges:[]}
        // FIX BUG#3: API wraps nodes as {data:{id,label,status,...}}
        // flatten helper for stats — works for both wrapped and legacy flat shapes
        const raw=graphData.value.nodes
        const ns=raw.map(x=>x.data||x)
        stats.value={
          total:ns.length,
          done:ns.filter(x=>x.status==='done').length,
          failed:ns.filter(x=>x.status==='failed').length,
          healed:ns.filter(x=>x.status==='healed').length,
          replanned:ns.filter(x=>x.status==='replanned').length,
        }
      } catch {}
    }
    onMounted(()=>{fetch();t=setInterval(fetch,3000)})
    onUnmounted(()=>clearInterval(t))
    const STATUS_COLOR={done:'#22c55e',running:'#f59e0b',failed:'#ef4444',pending:'#4b5066',healed:'#8b5cf6',replanned:'#06b6d4',workflow:'#22c55e',active:'#22c55e'}
    // FIX BUG#3: helper to get flat node data regardless of wrapping
    function nd(n){return n.data||n}
    return { graphData, selected, stats, STATUS_COLOR, nd }
  },
  template:`
  <div style="display:flex;flex-direction:column;gap:20px">
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-val">{{stats.total}}</div><div class="stat-label">Total tasks</div></div>
      <div class="stat-card"><div class="stat-val" style="color:#22c55e">{{stats.done}}</div><div class="stat-label">Done</div></div>
      <div class="stat-card"><div class="stat-val" style="color:#ef4444">{{stats.failed}}</div><div class="stat-label">Failed</div></div>
      <div class="stat-card" v-if="stats.healed"><div class="stat-val" style="color:#8b5cf6">{{stats.healed}}</div><div class="stat-label">Healed</div></div>
    </div>
    <div class="card">
      <div class="panel-title">🕸️ Task Graph — {{graphData.nodes.length}} nodes</div>
      <div v-if="!graphData.nodes||!graphData.nodes.length" style="color:var(--muted);font-size:14px;padding:20px;text-align:center">{{t('tg2_empty')}}</div>
      <div v-else style="display:flex;flex-direction:column;gap:6px">
        <div v-for="n in graphData.nodes.slice(0,30)" :key="nd(n).id" style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:4px;cursor:pointer;border:1px solid var(--border)" :style="{borderLeftColor:STATUS_COLOR[nd(n).status]||STATUS_COLOR[nd(n).type]||'var(--border)',borderLeftWidth:'3px'}" @click="selected=n">
          <span class="badge" :style="{background:(STATUS_COLOR[nd(n).status]||STATUS_COLOR[nd(n).type]||'#525252')+'22',color:STATUS_COLOR[nd(n).status]||STATUS_COLOR[nd(n).type]||'#525252'}" style="font-size:12px">{{nd(n).status||nd(n).type}}</span>
          <span style="font-size:14px;flex:1;color:var(--txt2)">{{nd(n).label||nd(n).id}}</span>
          <span v-if="nd(n).duration_ms" style="font-family:var(--mono);font-size:12px;color:var(--muted)">{{nd(n).duration_ms}}ms</span>
        </div>
      </div>
    </div>
    <div v-if="selected" class="card">
      <div class="panel-title">📋 Node detail</div>
      <pre style="font-size:13px;font-family:var(--mono);color:var(--txt2);overflow-x:auto">{{JSON.stringify(nd(selected),null,2)}}</pre>
    </div>
  </div>`
}

// ── Forensic ──────────────────────────────────────────────────
const ForensicView = {
  setup() {
    const episodes=ref([]), selected=ref(null), step=ref(0), loading=ref(false)
    onMounted(async()=>{
      loading.value=true
      try{const r=await api.get('/api/v2/forensic/episodes');episodes.value=r.data.episodes||[];if(episodes.value.length)selected.value=episodes.value[0]}catch{}
      loading.value=false
    })
    function select(ep){selected.value=ep;step.value=0}
    const curStep=computed(()=>selected.value?.steps?.[step.value]||null)
    return { episodes, selected, step, loading, select, curStep }
  },
  template:`
  <div class="g2" style="height:calc(100vh - 120px)">
    <div style="overflow-y:auto;border-right:1px solid var(--border);padding-right:16px">
      <div class="panel-title" style="margin-bottom:10px">📼 Episodes ({{episodes.length}})</div>
      <div class="loading" v-if="loading">{{t('sp_loading')}}</div>
      <div v-else-if="!episodes.length" style="color:var(--muted);font-size:14px">{{t('fo_empty')}}</div>
      <div v-for="ep in episodes" :key="ep.task_id" class="glass" style="padding:10px;margin-bottom:8px;cursor:pointer" :style="{borderColor:selected?.task_id===ep.task_id?'var(--bee)':'var(--border)'}" @click="select(ep)">
        <div style="font-size:14px;font-weight:600;margin-bottom:4px">{{ep.success?'✅':'❌'}} {{ep.goal?.slice(0,60)}}</div>
        <div style="font-size:12px;color:var(--muted);font-family:var(--mono)">{{ep.total_steps}} steps · {{ep.task_id?.slice(0,8)}}</div>
      </div>
    </div>
    <div v-if="selected" style="overflow-y:auto">
      <div class="panel-title" style="margin-bottom:10px">🔬 Replay: {{selected.goal?.slice(0,40)}}</div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
        <button class="btn btn-ghost" :disabled="step<=0" @click="step--" style="font-size:13px">◀ Prev</button>
        <span style="font-size:14px;color:var(--muted)">Step {{step+1}} / {{selected.steps?.length||0}}</span>
        <button class="btn btn-ghost" :disabled="step>=(selected.steps?.length||1)-1" @click="step++" style="font-size:13px">Next ▶</button>
      </div>
      <div v-if="curStep" class="card">
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <span class="badge" :class="curStep.status==='done'?'badge-ok':curStep.status==='failed'?'badge-danger':'badge-warn'">{{curStep.status}}</span>
          <span style="font-size:14px;font-weight:600">{{curStep.action}}</span>
        </div>
        <div style="font-size:14px;color:var(--txt2);margin-bottom:8px">{{curStep.description}}</div>
        <div v-if="curStep.thought" style="font-size:13px;color:var(--muted);background:var(--bg3);padding:8px;border-radius:4px;margin-bottom:8px;font-style:italic">💭 {{curStep.thought}}</div>
        <div v-if="curStep.error" style="font-size:13px;color:var(--danger);background:rgba(239,68,68,.08);padding:8px;border-radius:4px">❌ {{curStep.error}}</div>
      </div>
    </div>
    <div v-else style="display:flex;align-items:center;justify-content:center;color:var(--muted)">{{t('fo_select')}}</div>
  </div>`
}

// ── Export ────────────────────────────────────────────────────
const ExportView = {
  setup() {
    const msg=ref(''), exporting=ref(false)
    async function doExport(type) {
      exporting.value=true; msg.value=''
      try {
        const r=await api.get('/api/v2/system/stats')
        const blob=new Blob([JSON.stringify(r.data,null,2)],{type:'application/json'})
        const url=URL.createObjectURL(blob)
        const a=document.createElement('a'); a.href=url; a.download=`phidipus-${type}-${Date.now()}.json`; a.click(); URL.revokeObjectURL(url)
        msg.value='✅ Đã export '+type
      } finally{exporting.value=false}
    }
    return { msg, exporting, doExport }
  },
  template:`
  <div>
    <div v-if="msg" class="badge badge-ok" style="padding:10px 14px;margin-bottom:16px;display:block;font-size:15px">{{msg}}</div>
    <div class="card">
      <div class="panel-title">📤 Export Data</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-bee" :disabled="exporting" @click="doExport('stats')">📊 Stats JSON</button>
        <button class="btn btn-ghost" :disabled="exporting" @click="doExport('config')">⚙️ Config</button>
      </div>
    </div>
  </div>`
}

// ═══════════════════════════════════════════════════════════
// ROUTER
// ═══════════════════════════════════════════════════════════
const router = createRouter({
  history: createWebHistory(),
  routes: [
    { path: '/',            component: HomeView },
    { path: '/chrome',      component: ChromeView },
    { path: '/skill-forge', component: SkillForgeView },
    { path: '/shadow',      component: ShadowModeView },
    { path: '/task-graph',  component: TaskGraphView },
    { path: '/memory',      component: MemoryView },
    { path: '/resource',    component: ResourceView },
    { path: '/security',    component: SecurityView },
    { path: '/export',      component: ExportView },
    { path: '/god-mode',    component: GodModeView },
    { path: '/forensic',    component: ForensicView },
    { path: '/providers',   component: ProvidersView },
    { path: '/telegram',    component: TelegramView },
    { path: '/workflow-teacher', component: WorkflowTeacherView },
    { path: '/openclaw', component: OpenClawStoreView },
    { path: '/scheduler', component: SchedulerView },
    { path: '/spiderhub',       component: SpiderHubView },
    { path: '/:pathMatch(.*)', redirect: '/' },
  ]
})

// ═══════════════════════════════════════════════════════════
// ROOT APP
// ═══════════════════════════════════════════════════════════
const App = {
  setup() {
    const route=useRoute(), ws=useWsStore(), bee=useBeeStore(), shadow=useShadowStore()
    const open=ref(true), restarting=ref(false)

    onMounted(()=>{ ws.connect(); setInterval(async()=>{ try{const r=await api.get('/api/v2/system/stats');bee.updateResource({ram_pct:r.data.ram_pct||0,cpu_pct:r.data.cpu_pct||0,disk_gb:r.data.disk_free_gb||0})}catch{}},5000) })

    const NAV=computed(()=>[
      {path:'/',icon:'🏠',label:t('nav_home'),key:'1'},{path:'/task-graph',icon:'🕸️',label:t('nav_taskgraph'),key:'2'},{path:'/forensic',icon:'🔬',label:t('nav_forensic'),key:'3'},{path:'/skill-forge',icon:'⚡',label:t('nav_skillforge'),key:'4'},{path:'/shadow',icon:'👁️',label:t('nav_shadow'),key:'5',hi:true},{path:'/chrome',icon:'🌐',label:t('nav_chrome'),key:'6'},{path:'/memory',icon:'🧠',label:t('nav_memory'),key:'7'},{path:'/resource',icon:'📊',label:t('nav_resources'),key:'8'},{path:'/providers',icon:'🔌',label:t('nav_providers'),key:'9'},{path:'/telegram',icon:'🤖',label:t('nav_telegram'),key:'t'},{path:'/spiderhub',icon:'🕷️',label:t('nav_webprofiles'),key:'b'},{path:'/workflow-teacher',icon:'🎓',label:t('nav_workflow'),key:'w'},{path:'/openclaw',icon:'🦞',label:t('nav_openclaw'),key:'o'},{path:'/scheduler',icon:'📅',label:t('nav_scheduler'),key:'s'},{path:'/security',icon:'🔒',label:t('nav_security')},{path:'/god-mode',icon:'⚡',label:t('nav_godmode'),key:'0'},
    ])
    const label=computed(()=>NAV.value.find(n=>n.path===route.path)?.label||'Phidipus')

    async function restart() {
      if(!confirm(t('confirm_restart'))) return; restarting.value=true
      try{await api.post('/api/v2/system/restart');setTimeout(()=>location.reload(),3000)}catch{restarting.value=false}
    }
    return { open, restarting, NAV, label, ws, bee, shadow, route, restart, t, currentLang, setLang, LANGS }
  },
  template:`
  <div class="root">
    <!-- Sidebar -->
    <nav class="sidebar" :class="{collapsed:!open}">
      <div class="sidebar-logo" @click="open=!open">
        <img src="/static/logo-phidipus.png" alt="🕷️" onerror="this.textContent='🕷️';this.style.fontSize='20px'"/>
        <span v-if="open" class="logo-text">Phidipus</span>
      </div>
      <RouterLink v-for="n in NAV" :key="n.path" :to="n.path" class="nav-item" :class="{active:route.path===n.path,highlight:n.hi}">
        <span class="nav-icon">{{n.icon}}</span>
        <span v-if="open">{{n.label}}</span>
        <span v-if="open&&n.key" class="nav-key">{{n.key}}</span>
      </RouterLink>
      <div class="sidebar-foot">
        <div style="font-size:13px;color:var(--muted);display:flex;align-items:center">
          <span class="ws-dot" :class="{on:ws.connected}"></span>
          <span v-if="open">{{ws.connected?'Online':'Offline'}}</span>
        </div>
      </div>
    </nav>

    <!-- Main -->
    <div class="main">
      <div class="topbar">
        <span class="topbar-title">{{label}}</span>
        <div class="topbar-right">
          <div style="position:relative;display:inline-block" class="lang-sw">
            <button class="btn btn-ghost" style="padding:4px 10px" @click="$event.currentTarget.parentElement.classList.toggle('open')">{{LANGS[currentLang]?.flag}} {{LANGS[currentLang]?.name}}</button>
            <div style="position:absolute;right:0;top:100%;margin-top:4px;background:var(--bg2);border:1px solid var(--border-a);border-radius:6px;padding:4px;z-index:999;min-width:150px;display:none">
              <div v-for="(info,code) in LANGS" :key="code" @click="setLang(code);$event.currentTarget.parentElement.style.display='none'" style="padding:6px 12px;cursor:pointer;border-radius:4px;display:flex;align-items:center;gap:8px;font-size:16px" :style="{background:code===currentLang?'var(--glass)':'transparent',color:code===currentLang?'var(--bee)':'var(--txt2)'}">
                <span>{{info.flag}}</span><span>{{info.name}}</span>
              </div></div></div>
          <span class="badge" :class="bee.ramPct>80?'badge-danger':'badge-bee'" style="font-size:13px;font-family:var(--mono)">RAM {{bee.ramPct}}%</span>
          <span v-if="shadow.enabled" class="badge" style="background:rgba(167,139,250,.15);color:#a78bfa;border:1px solid rgba(167,139,250,.3);font-size:13px">👁️ Shadow</span>
          <button class="btn btn-ghost" :disabled="restarting" @click="restart" style="font-size:13px">{{restarting?t('btn_restarting'):t('btn_restart')}}</button>
        </div>
      </div>
      <div class="view">
        <RouterView/>
      </div>
    </div>
  </div>`
}

// ═══════════════════════════════════════════════════════════
// MOUNT
// ═══════════════════════════════════════════════════════════
const pinia = createPinia()
const app   = createApp(App)
app.use(pinia)
app.use(router)
app.component('RouterLink', RouterLink)
app.component('RouterView', RouterView)
app.config.globalProperties.t = t
app.config.globalProperties.currentLang = currentLang
app.config.globalProperties.setLang = setLang
app.config.globalProperties.LANGS = LANGS
try {
  app.mount('#app')
} catch(e) {
  document.getElementById('app').innerHTML =
    '<div style="color:#ef4444;padding:40px;font-family:monospace;font-size:15px">' +
    '<b>❌ Vue mount error:</b><br><pre>' + e.message + '</pre>' +
    '<br>Mở F12 → Console để xem chi tiết.</div>'
  console.error('[Phidipus] Mount failed:', e)
}
</script>
</body>
</html>
