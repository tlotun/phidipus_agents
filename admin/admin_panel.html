<html lang="vi">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Phidipus — Agent OS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/apexcharts/3.49.0/apexcharts.min.js"></script>

<style>
:root{--bg:#0a0a0a;--bg2:#111;--bg3:#1a1a1a;--bg4:#222;--glass:rgba(34,197,94,.04);--glass-h:rgba(34,197,94,.08);--border:rgba(34,197,94,.12);--border-a:rgba(34,197,94,.3);--bee:#22c55e;--honey:#4ade80;--info:#38bdf8;--shadow:#a78bfa;--txt:#e5e5e5;--txt2:#a3a3a3;--muted:#525252;--danger:#ef4444;--warn:#eab308;--r:6px;--font:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:thin;scrollbar-color:var(--border-a) var(--bg)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border-a);border-radius:3px}
html,body,#app{height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--info);text-decoration:none}
/* Layout */
.root{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;min-width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width .2s}
.sidebar.collapsed{width:56px;min-width:56px}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:16px 12px;cursor:pointer;border-bottom:1px solid var(--border)}
.sidebar-logo img{width:28px;height:28px;border-radius:6px}
.logo-text{font-weight:700;font-size:17px;color:var(--bee);letter-spacing:.02em}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;color:var(--txt2);text-decoration:none;border-left:2px solid transparent;transition:all .15s;cursor:pointer;font-size:15px}
.nav-item:hover{color:var(--txt);background:var(--glass)}
.nav-item.active{color:var(--bee);border-left-color:var(--bee);background:rgba(34,197,94,.06)}
.nav-item.highlight{color:var(--shadow)}
.nav-icon{font-size:18px;min-width:20px;text-align:center}
.nav-key{margin-left:auto;font-size:12px;color:var(--muted);font-family:var(--mono);background:var(--bg3);padding:1px 5px;border-radius:3px}
.sidebar-foot{margin-top:auto;padding:12px;border-top:1px solid var(--border)}
.ws-dot{width:7px;height:7px;border-radius:50%;background:var(--danger);display:inline-block;margin-right:6px}
.ws-dot.on{background:var(--bee)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--bg2)}
.topbar-title{font-size:17px;font-weight:600;color:var(--txt)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.view{flex:1;overflow-y:auto;padding:24px}
/* Glass cards */
.glass{background:var(--glass);border:1px solid var(--border);border-radius:var(--r);backdrop-filter:blur(6px)}
.glass:hover{border-color:var(--border-a)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.panel-title{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}
/* Buttons */
.btn{border:none;border-radius:4px;padding:6px 16px;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.04em;transition:opacity .15s}
.btn:hover{opacity:.85}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-bee{background:var(--bee);color:#000}
.btn-info{background:var(--info);color:#000}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--border-a);color:var(--txt2)}
.btn-ghost:hover{border-color:var(--bee);color:var(--bee)}
/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:13px;font-weight:600}
.badge-bee{background:rgba(34,197,94,.15);color:var(--bee);border:1px solid rgba(34,197,94,.3)}
.badge-ok{background:rgba(34,197,94,.1);color:var(--bee)}
.badge-danger{background:rgba(239,68,68,.1);color:var(--danger);border:1px solid rgba(239,68,68,.2)}
.badge-warn{background:rgba(234,179,8,.1);color:var(--warn)}
.badge-info{background:rgba(56,189,248,.1);color:var(--info)}
/* Inputs */
.inp{background:var(--bg3);border:1px solid var(--border);color:var(--txt);border-radius:4px;padding:7px 12px;font-size:15px;width:100%;font-family:var(--mono);outline:none}
.inp:focus{border-color:var(--bee)}
/* Grids */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
/* Stat cards */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px;text-align:center}
.stat-val{font-size:30px;font-weight:700;color:var(--bee);font-family:var(--mono)}
.stat-label{font-size:13px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}
/* Gauge */
.gauge{height:4px;background:var(--bg3);border-radius:2px;margin-top:8px;overflow:hidden}
.gauge-fill{height:100%;background:var(--bee);border-radius:2px;transition:width .5s}
/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;padding:8px 12px;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.tbl td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--txt2)}
.tbl tr:hover td{background:var(--glass);color:var(--txt)}
/* Tags */
.tag{display:inline-block;padding:2px 7px;border-radius:3px;font-size:12px;font-weight:600;font-family:var(--mono)}
/* Telegram specific */
.tg-section{display:flex;flex-direction:column;gap:20px}
.tg-status{display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:var(--r);border:1px solid var(--border)}
.tg-status.running{border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.04)}
.tg-status.stopped{border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.03)}
.status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.status-dot.on{background:var(--bee);box-shadow:0 0 8px var(--bee)}
.status-dot.off{background:var(--danger)}
/* Provider cards */
.prov-card{border:1px solid var(--border);border-radius:var(--r);padding:16px;background:var(--bg2)}
.prov-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.prov-icon{font-size:22px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.prov-name{font-weight:700;font-size:16px}
.prov-tier{font-size:13px;color:var(--muted)}
/* Nav active animation */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.loading{animation:pulse 1.2s ease-in-out infinite;color:var(--muted)}
/* Responsive */
.wt-tooltip{position:fixed;z-index:1000;background:#1a1a1a;border:1px solid rgba(34,197,94,.3);border-radius:6px;padding:12px;width:280px;box-shadow:0 8px 32px rgba(0,0,0,.6);pointer-events:none;animation:wtFadeIn .15s ease}
@keyframes wtFadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.wt-node{position:absolute;width:180px;padding:10px 12px;background:var(--bg2);border:1.5px solid var(--border);border-radius:6px;cursor:grab;z-index:2;transition:border-color .15s,box-shadow .15s;user-select:none}
.wt-node:hover{box-shadow:0 0 12px rgba(34,197,94,.1);z-index:3}
.wt-label{font-size:11px;font-weight:600;color:var(--muted);display:block;margin-bottom:3px}

.lang-sw.open>div:last-child{display:block!important}
.lang-sw>div:last-child>div:hover{background:var(--glass-h)!important}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}.sidebar{width:56px;min-width:56px}.nav-item span:not(.nav-icon){display:none}.nav-key{display:none}.logo-text{display:none}}
</style>
</head>

// ── Token injection: admin_server_v2 sets window.__BEEHIVE_TOKEN__ ──
const ADMIN_TOKEN = window.__BEEHIVE_TOKEN__ || ''

const WS_URL      = (location.protocol === 'https:' ? 'wss://' : 'ws://') + (location.host || '127.0.0.1:8912') + '/api/v2/ws'

// ── Axios instance with auth ─────────────────────────────────
const api = axios.create({ baseURL: API_BASE, timeout: 30000 })
api.interceptors.request.use(cfg => {
  if (ADMIN_TOKEN) cfg.headers['X-Phidipus-Token'] = ADMIN_TOKEN
  return cfg
})
api.interceptors.response.use(r => r, err => {
  console.warn('[Phidipus]', err?.response?.status, err.message)
  return Promise.reject(err)
})

  wt_tips:{vi:'1. Trigger đa dạng: Viết 3-5 câu trigger — càng nhiều cách, agent nhận diện càng tốt\n2. Luôn thêm Wait: Sau Navigate/Click — chờ 1-3 giây\n3. Dùng Condition: Kiểm tra trước khi hành động\n4. Screenshot cuối: Đặt Screenshot trước Notify để xác nhận\n5. Chia nhỏ: 1 workflow nên có 3-7 bước\n6. Test trước: Bấm ▶ Test để kiểm tra\n7. CSS Selector: Dùng DevTools (F12) → Inspect → copy selector',en:'1. Varied triggers: Write 3-5 phrases — more variation = better recognition\n2. Always Wait: After Navigate/Click — wait 1-3s\n3. Use Condition: Check before acting\n4. End with Screenshot: Place before Notify to confirm\n5. Keep small: 3-7 steps per workflow\n6. Test first: Click ▶ Test to verify\n7. CSS Selector: Use DevTools (F12) → Inspect → copy',zh:'1. 多样化触发：写3-5个短语\n2. 始终等待：Navigate/Click后等1-3秒\n3. 使用条件：操作前检查\n4. 截图确认：Notify前放Screenshot\n5. 保持简洁：每个工作流3-7步\n6. 先测试：点击▶测试\n7. CSS选择器：用DevTools(F12)→检查→复制',ko:'1. 다양한 트리거: 3-5개 문구 작성\n2. 항상 Wait: Navigate/Click 후 1-3초\n3. Condition 사용: 행동 전 확인\n4. 스크린샷: Notify 전에 배치\n5. 간결하게: 워크플로우당 3-7단계\n6. 먼저 테스트: ▶ 테스트 클릭\n7. CSS 선택자: DevTools(F12) → 검사 → 복사'},

const useBeeStore = defineStore('bee', () => {
  const ramPct      = ref(0), cpuPct = ref(0), diskGb = ref(0)
  const taskRunning = ref(false), taskGoal = ref('')
  const taskHistory = ref([])
  const chromeProfiles = ref([]), chromeTotal = ref(0)
  const forgeProviders = ref([]), forgeCachedSkills = ref(0)
  const skillRegistry  = ref([]), failureRecords = ref([])
  const workflowStats  = ref({plans:0,templates:0,promoted:0})
  const resourceHealthy = computed(() => ramPct.value < 85 && cpuPct.value < 90)
  const hasSafetyEvents = computed(() => false)

  function updateResource(d) {
    if (d?.ram_pct != null) ramPct.value = Math.round(d.ram_pct)
    if (d?.cpu_pct != null) cpuPct.value = Math.round(d.cpu_pct)
    if (d?.disk_gb != null) diskGb.value = Math.round(d.disk_gb)
  }

  async function fetchChromeProfiles() {
    try { const r = await api.get('/api/v2/chrome/profiles/status'); chromeProfiles.value = r.data.profiles||[]; chromeTotal.value = r.data.total||0 } catch {}
  }
  async function fetchForgeRadar() {
    try { const r = await api.get('/api/v2/skill/forge/radar'); forgeProviders.value = r.data.providers||[]; forgeCachedSkills.value = r.data.cached_skills||0 } catch {}
  }
  async function fetchSkillRegistry() {
    try { const r = await api.get('/api/v2/skill/registry'); skillRegistry.value = r.data.skills||[] } catch {}
  }
  async function fetchFailureMemory() {
    try { const r = await api.get('/api/v2/memory/failure'); failureRecords.value = r.data.recent||[] } catch {}
  }
  async function fetchWorkflowLibrary() {
    try { const r = await api.get('/api/v2/workflow/library'); const s=r.data.stats||{}; workflowStats.value={plans:s.plan_cache_entries||0,templates:s.workflow_templates||0,promoted:s.plan_cache_promoted||0} } catch {}
  }
  async function runTask(goal) {
    if (!goal.trim()) return; taskRunning.value = true; taskGoal.value = goal
    try { await api.post('/api/v2/task/run', {goal}) } finally { setTimeout(()=>{taskRunning.value=false},8000) }
  }
  async function godReset() {
    try { await api.post('/api/v2/system/god-reset', {confirm:true}) } catch {}
  }
  return { ramPct, cpuPct, diskGb, taskRunning, taskGoal, taskHistory, chromeProfiles, chromeTotal,
           forgeProviders, forgeCachedSkills, skillRegistry, failureRecords, workflowStats,
           resourceHealthy, hasSafetyEvents, updateResource,
           fetchChromeProfiles, fetchForgeRadar, fetchSkillRegistry, fetchFailureMemory, fetchWorkflowLibrary, runTask, godReset }
})

const useWsStore = defineStore('ws', () => {
  const connected   = ref(false)
  const lastMessage = ref(null)
  const heartbeat   = ref({})
  let socket = null, reconnTimer = null

  function connect() {
    if (socket?.readyState === WebSocket.OPEN) return
    socket = new WebSocket(WS_URL)
    socket.onopen  = () => { connected.value = true }
    socket.onclose = () => { connected.value = false; reconnTimer = setTimeout(connect, 3000) }
    socket.onerror = () => { connected.value = false }
    socket.onmessage = ev => {
      try {
        const msg = JSON.parse(ev.data)
        lastMessage.value = msg
        if (msg.event === 'heartbeat') heartbeat.value = msg.data
      } catch {}
    }
  }
  const resource = computed(() => heartbeat.value?.resource || {})
  return { connected, lastMessage, heartbeat, resource, connect }
})

const useShadowStore = defineStore('shadow', () => {
  const enabled = ref(false), privacyLevel = ref('medium'), segments = ref([]), loading = ref(false)
  async function fetchState() {
    try { const r=await api.get('/api/v2/shadow/state'); enabled.value=r.data.enabled; privacyLevel.value=r.data.privacy; segments.value=r.data.segments||[] } catch {}
  }
  async function toggle() {
    loading.value=true; try { const r=await api.post('/api/v2/shadow/toggle',{privacy:privacyLevel.value}); enabled.value=r.data.enabled } finally { loading.value=false }
  }
  function setPrivacy(l) { privacyLevel.value=l; api.post('/api/v2/config/shadow',{privacy_level:l}).catch(()=>{}) }
  const successRate = computed(() => { if(!segments.value.length) return 0; return Math.round(segments.value.filter(s=>s.success).length/segments.value.length*100) })
  return { enabled, privacyLevel, segments, loading, successRate, fetchState, toggle, setPrivacy }
})

      } else if(ev==='task_start'||ev==='task_run'){

        text='[forge] '+(msg.data?.skill||msg.data?.msg||JSON.stringify(msg.data||{}).slice(0,80))

        if(raw==='{}') return  // skip empty heartbeat data

        color='var(--txt2)'

      const ts=new Date((msg.ts||Date.now()/1000)*1000).toLocaleTimeString('vi-VN')

const TelegramView = {
  setup() {
    const tokenInput=ref(''), adminInput=ref('')
    const tokenSet=ref(false), tokenMasked=ref(''), adminIds=ref([]), botRunning=ref(false)
    const readyToStart=ref(false), botUsername=ref(''), saving=ref(false), starting=ref(false)
    const stopping=ref(false), testing=ref(false), showToken=ref(false)
    const saveMsg=ref(''), startMsg=ref(''), testResult=ref(null)

    async function fetchConfig() {
      try {
        const r=await api.get('/api/v2/telegram/config')
        tokenSet.value=!!r.data.token_set
        if(r.data.token_masked) tokenMasked.value=r.data.token_masked
        adminIds.value=r.data.admin_ids||[]
        botRunning.value=r.data.bot_running||false
        readyToStart.value=r.data.ready_to_start||false
        if(adminIds.value.length>0) adminInput.value=adminIds.value.join(', ')
        if(r.data.bot_username) botUsername.value=r.data.bot_username
      } catch {}
    }

    async function saveToken() {
      if(!tokenInput.value.trim()) return; saving.value=true; saveMsg.value=''
      try {
        const r=await api.post('/api/v2/telegram/token',{token:tokenInput.value.trim()})
        if(r.data.ok){saveMsg.value='✅ Token đã lưu!';tokenSet.value=true;tokenMasked.value=r.data.token_masked||'****';tokenInput.value=''}
        await fetchConfig()
      } catch(e){saveMsg.value='❌ '+(e?.response?.data?.detail||e.message)} finally{saving.value=false}
    }

    async function saveAdmins() {
      saving.value=true; saveMsg.value=''
      try {
        const ids=adminInput.value.split(/[,\s]+/).filter(Boolean).map(Number).filter(n=>!isNaN(n)&&n>0)
        if(!ids.length){saveMsg.value='❌ Nhập ít nhất 1 Admin ID';saving.value=false;return}
        const r=await api.post('/api/v2/telegram/admins',{admin_ids:ids})
        if(r.data.ok){saveMsg.value='✅ Admin IDs đã lưu!';adminIds.value=r.data.admin_ids||ids;await fetchConfig()}
      } catch(e){saveMsg.value='❌ '+(e?.response?.data?.detail||e.message)} finally{saving.value=false}
    }

    async function startBot() {
      starting.value=true; startMsg.value=''
      try {
        const r=await api.post('/api/v2/telegram/start')
        if(r.data.ok){startMsg.value='✅ Bot đã kết nối! '+(r.data.bot_username?'@'+r.data.bot_username:'');await fetchConfig()}
        else startMsg.value='❌ '+(r.data.error||'Lỗi không xác định')+(r.data.hint?'\n'+r.data.hint:'')
      } catch(e){startMsg.value='❌ '+(e?.response?.data?.error||e.message)} finally{starting.value=false}
    }

    async function stopBot() {
      if(!confirm(t('tg_confirm_stop'))) return
      stopping.value=true; startMsg.value=''
      try { const r=await api.post('/api/v2/telegram/stop'); if(r.data.ok){startMsg.value='⏹️ Bot đã dừng.';await fetchConfig()} } catch(e){startMsg.value='❌ '+e.message} finally{stopping.value=false}
    }

    async function testToken() {
      testing.value=true; testResult.value=null
      try { const r=await api.post('/api/v2/telegram/test'); testResult.value=r.data } catch(e){testResult.value={ok:false,error:e.message}} finally{testing.value=false}
    }

    onMounted(fetchConfig)

    return { tokenInput,adminInput,tokenSet,tokenMasked,adminIds,botRunning,readyToStart,botUsername,
             saving,starting,stopping,testing,showToken,saveMsg,startMsg,testResult,
             saveToken,saveAdmins,startBot,stopBot,testToken }

const SpiderHubView = {
  setup() {
    const profiles=ref([]), hs=ref({}), loading=ref(false), saving=ref(false), saveMsg=ref('')
    const showAdd=ref(false), activeTab=ref('profiles')
    const newP=reactive({name:'',description:'',active:true,platforms:['facebook'],chrome_dir:'',content_lang:'vi',post_delay_s:0,tags:''})
    const editP=ref(null)

    // Scan state
    const scanResult=ref(null), scanning=ref(false), importing=ref(false)
    const selectedNew=ref([])

    async function scanChrome() {
      scanning.value=true; saveMsg.value=''
      try {
        const r=await api.get('/api/v2/spiderhub/scan')
        scanResult.value=r.data
        selectedNew.value=r.data.new.map(p=>p.name)  // pre-select all new
      } catch(e) { saveMsg.value='❌ Scan lỗi: '+(e?.response?.data?.detail||e.message) }
      finally { scanning.value=false }
    }

    function toggleSelect(name) {
      const idx=selectedNew.value.indexOf(name)
      if(idx>=0) selectedNew.value.splice(idx,1)
      else selectedNew.value.push(name)
    }

    async function importSelected() {
      if(!selectedNew.value.length) { saveMsg.value='❌ Chọn ít nhất 1 profile'; return }
      importing.value=true; saveMsg.value=''
      try {
        const r=await api.post('/api/v2/spiderhub/import-from-chrome', {
          profiles: selectedNew.value,
          active: true,
          platforms: hs.value.default_platforms||['facebook'],
          content_lang: hs.value.default_content_lang||'vi',
        })
        saveMsg.value='✅ Đã import '+(r.data.added.length)+' profiles!'
        await load()
        await scanChrome()
        selectedNew.value=[]
      } catch(e) { saveMsg.value='❌ '+(e?.response?.data?.detail||e.message) }
      finally { importing.value=false }
    }

    async function importAll() {
      importing.value=true; saveMsg.value=''
      try {
        const r=await api.post('/api/v2/spiderhub/import-all-new', {
          active: true,
          platforms: hs.value.default_platforms||['facebook'],
          content_lang: hs.value.default_content_lang||'vi',
        })
        saveMsg.value='✅ Đã import '+(r.data.added.length)+' profiles mới!'
        await load()
        scanResult.value=null
      } catch(e) { saveMsg.value='❌ '+e.message }
      finally { importing.value=false }
    }

    async function load() {
      loading.value=true
      try {
        const r=await api.get('/api/v2/spiderhub/profiles')
        profiles.value=r.data.profiles||[]
        hs.value=r.data.hive_settings||{}
      } catch { profiles.value=[] } finally { loading.value=false }
    }

    async function saveSettings() {
      saving.value=true; saveMsg.value=''
      try {
        await api.post('/api/v2/spiderhub/settings', hs.value)
        saveMsg.value='✅ Đã lưu hive settings!'
        setTimeout(()=>saveMsg.value='', 3000)
      } catch(e) { saveMsg.value='❌ '+e.message } finally { saving.value=false }
    }

    async function addProfile() {
      if(!newP.name.trim()){saveMsg.value='❌ Nhập tên profile'; return}
      saving.value=true; saveMsg.value=''
      try {
        const body={...newP, tags:newP.tags.split(',').map(t=>t.trim()).filter(Boolean)}
        await api.post('/api/v2/spiderhub/profiles', body)
        saveMsg.value='✅ Profile đã thêm!'
        showAdd.value=false
        Object.assign(newP,{name:'',description:'',active:true,platforms:['facebook'],chrome_dir:'',content_lang:'vi',post_delay_s:0,tags:''})
        await load()
      } catch(e) { saveMsg.value='❌ '+(e?.response?.data?.detail||e.message) } finally { saving.value=false }
    }

    async function toggleActive(p) {
      try {
        await api.put('/api/v2/spiderhub/profiles/'+p.name, {active:!p.active})
        await load()
      } catch(e) { saveMsg.value='❌ '+e.message }
    }

    async function deleteProfile(name) {
      if(!confirm('Xoá profile '+name+'?')) return
      try { await api.delete('/api/v2/spiderhub/profiles/'+name); await load() }
      catch(e) { saveMsg.value='❌ '+e.message }
    }

    onMounted(load)

    const activeCount=computed(()=>profiles.value.filter(p=>p.active).length)
    const PLATFORMS=['facebook','instagram','x']
    function togglePlatform(list, plat) {
      const idx=list.indexOf(plat)
      if(idx>=0) list.splice(idx,1)
      else list.push(plat)
    }

    return { t, profiles, hs, loading, saving, saveMsg, showAdd, newP, editP,
             activeCount, PLATFORMS, load, saveSettings, addProfile, toggleActive, deleteProfile, togglePlatform,
             activeTab, scanResult, scanning, importing, selectedNew, scanChrome, toggleSelect, importSelected, importAll }
  },

              <input type="checkbox" :checked="selectedNew.includes(p.name)"
                     @change="toggleSelect(p.name)" style="cursor:pointer"/>
              <div style="flex:1">
                <div style="font-weight:600;font-size:15px;font-family:var(--mono);color:var(--bee)">{{p.name}}</div>
                <div style="font-size:13px;color:var(--muted)">
                  {{p.directory}}
                  <span v-if="p.email"> · {{p.email}}</span>
                  <span v-if="p.is_default"> · Default</span>
                </div>
              </div>
            </div>
            <div style="display:flex;gap:8px;margin-top:12px">
              <button class="btn btn-bee" :disabled="importing||!selectedNew.length" @click="importSelected" style="font-size:13px">
                {{importing?'⏳':'✅'}} Import {{selectedNew.length}}
              </button>
              <button class="btn btn-ghost" @click="selectedNew=[...scanResult.new.map(p=>p.name)]" style="font-size:13px">{{t('btn_selectall')}}</button>
              <button class="btn btn-ghost" @click="selectedNew=[]" style="font-size:13px">{{t('btn_deselectall')}}</button>
            </div>
          </div>
          <div v-else-if="!scanning" style="color:var(--bee);font-size:15px;padding:16px;text-align:center">
            {{t('sp_all_done')}}
          </div>

          <!-- Already configured -->
          <div v-if="scanResult.configured&&scanResult.configured.length" style="margin-top:20px">
            <div class="panel-title" style="margin-bottom:8px">✅ Profiles đã config ({{scanResult.configured.length}})</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px">
              <span v-for="p in scanResult.configured" :key="p.name"
                class="badge" :class="p.active?'badge-bee':'badge-warn'"
                style="font-family:var(--mono)">
                {{p.name}} {{p.active?'ON':'OFF'}}
              </span>
            </div>
          </div>
        </div>

        <div v-else-if="!scanning" style="color:var(--muted);font-size:14px;text-align:center;padding:20px">
          {{t('sp_scan_hint')}}
        </div>
      </div>
    </template><!-- /scan tab -->

  </div>`
}

        created: new Date().toISOString(),
        active: true
      }
      activeWf.value = wf
      wfName.value = wf.name
      wfTrigger.value = ex.trigger
      selectedNode.value = null
      showList.value = false
      nextId = Math.max(...wf.nodes.map(n=>parseInt(n.id.split('_')[1])||0), 0) + 1
      isDirty.value = true
      startDraftTimer()
    }

    // Tab state for guide
    const showGuide = ref(false)

    // Default config per type
    function defaultConfig(type) {
      const configs = {
        trigger:    {phrases:[], description:''},
        chrome:     {action:'navigate', url:'', selector:'', text:'', wait_after:1},
        file:       {action:'find', path:'', pattern:'*', destination:''},
        terminal:   {command:'', cwd:'', timeout:30},
        type_text:  {text:'', use_clipboard:true, target_selector:''},
        click:      {target:'', by_text:true, x:0, y:0},
        wait:       {seconds:2, wait_for_selector:'', timeout:10},
        condition:  {check:'element_exists', selector:'', value:'', then_node:'', else_node:''},
        screenshot: {save_path:'', send_telegram:true},
        notify:     {message:'✅ Workflow hoàn thành!', include_screenshot:false},
      generate_report: {title:'AI Research Report', ai_summary:true, send_telegram:true, save:true, model:'auto'},
      create_document: {title:'', format:'xlsx', ai_structure:true, send_telegram:true, model:'auto'},
        scroll:     {direction:'down', pixels:500, scroll_to_selector:'', scroll_to_bottom:false},
        download_wait: {pattern:'*', folder:'~/Downloads', move_to:'', timeout:120, send_telegram:false},
        app_launch: {app_name:'', app_path:'', wait_after:3},
        ai_process: {action:'summarize', model:'auto', prompt:'', input_from:'previous', language:'vi', max_tokens:500, save_result:true},
        vision_click: {description:'', model:'auto', click_after:true, wait_after:2, retry:1, fallback_js:''},
      }
      return JSON.parse(JSON.stringify(configs[type] || {}))
    }

    function addNode(type) {
      if (!activeWf.value) return
      const id = 'n_' + (nextId++)
      const existing = activeWf.value.nodes
      const y = 80 + existing.length * 100
      const node = { id, type, x: 300, y, config: defaultConfig(type), next: [] }
      existing.push(node)
      // Auto-connect to previous node
      if (existing.length > 1) {
        const prev = existing[existing.length - 2]
        if (!prev.next.includes(id)) prev.next.push(id)
      }
      selectedNode.value = node
      markDirty()
    }

    function removeNode(id) {
      if (!activeWf.value) return
      activeWf.value.nodes = activeWf.value.nodes.filter(n => n.id !== id)
      activeWf.value.nodes.forEach(n => {
        // Clean next[] connections
        n.next = n.next.filter(x => x !== id)
        // FIX BUG-NEW-1: dọn dangling then_node/else_node refs trong condition nodes.
        // Trước fix: xóa node B → condition node vẫn giữ then_node:"B" hoặc else_node:"B"
        // → WorkflowExecutor.insert(0, "B") trên id không tồn tại → node_map miss → route sai.
        if (n.config?.then_node === id) n.config.then_node = ''
        if (n.config?.else_node === id) n.config.else_node = ''
      })
      if (selectedNode.value?.id === id) selectedNode.value = null
      markDirty()
    }

    function selectNode(node) { selectedNode.value = node }

    function startConnect(node) { connecting.value = node }
    function endConnect(node) {
      if (connecting.value && connecting.value.id !== node.id) {
        if (!connecting.value.next.includes(node.id)) {
          connecting.value.next.push(node.id)
        }
      }
      connecting.value = null
    }

    function removeConnection(fromId, toId) {
      const node = activeWf.value?.nodes.find(n => n.id === fromId)
      if (node) node.next = node.next.filter(x => x !== toId)
    }

    function getNode(id) { return activeWf.value?.nodes.find(n => n.id === id) }
    function nodeType(type) { return NODE_TYPES.value.find(t => t.type === type) || {} }

    // Drag support
    let dragNode = null, dragOffset = {x:0,y:0}
    function startDrag(e, node) {
      dragNode = node
      const rect = e.target.closest('.wt-node').getBoundingClientRect()
      dragOffset = { x: e.clientX - rect.left, y: e.clientY - rect.top }
      window.addEventListener('mousemove', onDrag)
      window.addEventListener('mouseup', stopDrag)
    }
    function onDrag(e) {
      if (!dragNode) return
      const canvas = document.querySelector('.wt-canvas')
      if (!canvas) return
      const cr = canvas.getBoundingClientRect()
      dragNode.x = Math.max(0, e.clientX - cr.left - dragOffset.x)
      dragNode.y = Math.max(0, e.clientY - cr.top - dragOffset.y)
    }
    function stopDrag() { dragNode = null; window.removeEventListener('mousemove', onDrag); window.removeEventListener('mouseup', stopDrag) }

    // SVG line between nodes — FIX BUG#4/#1: include then/else labeled edges
    function getLines() {
      if (!activeWf.value) return []
      const lines = []
      for (const node of activeWf.value.nodes) {
        // then_node / else_node (condition routing — FIX BUG#1)
        if (node.config?.then_node) {
          const to = getNode(node.config.then_node)
          if (to) lines.push({ from: node, to, key: node.id+'-then', isThen: true, isElse: false })
        }
        if (node.config?.else_node) {
          const to = getNode(node.config.else_node)
          if (to) lines.push({ from: node, to, key: node.id+'-else', isThen: false, isElse: true })
        }
        // Normal next[] connections (skip ids already covered by then/else to avoid double arrows)
        const thenId = node.config?.then_node || ''
        const elseId = node.config?.else_node || ''
        for (const nid of node.next) {
          if (nid === thenId || nid === elseId) continue
          const to = getNode(nid)
          if (to) lines.push({ from: node, to, key: node.id + '-' + nid, isThen: false, isElse: false })
        }
      }
      return lines
    }

    // Workflow CRUD
    function newWorkflow() {
      if (activeWf.value && activeWf.value.nodes?.length > 0 && !confirmLeave()) return
      const wf = { id: 'wf_' + Date.now(), name: '', trigger_phrases: [], nodes: [], created: new Date().toISOString(), active: true }
      activeWf.value = wf
      selectedNode.value = null
      showList.value = false
      wfName.value = ''
      wfTrigger.value = ''
      isDirty.value = false
      startDraftTimer()
      nextId = 1
      addNode('trigger')
    }

    async function saveWorkflow() {
      if (!activeWf.value) return
      activeWf.value.name = wfName.value || 'Workflow ' + activeWf.value.id.slice(-4)
      // Parse trigger phrases from trigger node
      const triggerNode = activeWf.value.nodes.find(n => n.type === 'trigger')
      if (triggerNode) {
        const raw = wfTrigger.value || triggerNode.config.phrases?.join(', ') || ''
        activeWf.value.trigger_phrases = raw.split(/[,\n]/).map(s => s.trim()).filter(Boolean)
        triggerNode.config.phrases = activeWf.value.trigger_phrases
      }
      saveMsg.value = '⏳'
      try {
        await api.post('/api/v2/workflow-teacher/save', { workflow: activeWf.value })
        saveMsg.value = t('wf_saved_ok'); clearDraft(); isDirty.value = false
        await fetchWorkflows()
        setTimeout(() => { saveMsg.value = '' }, 2000)
      } catch (e) { saveMsg.value = '❌ ' + (e.message || 'Lỗi') }
    }

    async function fetchWorkflows() {
      try {
        const r = await api.get('/api/v2/workflow-teacher/list')
        workflows.value = r.data?.workflows || []
      } catch {}
    }

    function editWorkflow(wf) {
      activeWf.value = JSON.parse(JSON.stringify(wf))
      wfName.value = wf.name
      wfTrigger.value = wf.trigger_phrases?.join(', ') || ''
      selectedNode.value = null
      showList.value = false
      nextId = Math.max(...(wf.nodes || []).map(n => parseInt(n.id.split('_')[1]) || 0), 0) + 1
    }

    async function deleteWorkflow(id) {
      if (!confirm(t('wf_confirm_del'))) return
      try { await api.post('/api/v2/workflow-teacher/delete', { id }) } catch {}
      await fetchWorkflows()
      if (activeWf.value?.id === id) { activeWf.value = null; showList.value = true }
    }

    async function toggleWorkflow(wf) {
      wf.active = !wf.active
      try { await api.post('/api/v2/workflow-teacher/save', { workflow: wf }) } catch {}
      await fetchWorkflows()
    }

    async function testWorkflow() {
      if (!activeWf.value) return
      testRunning.value = true; testResult.value = null
      try {
        const r = await api.post('/api/v2/workflow-teacher/test', { workflow: activeWf.value })
        testResult.value = r.data
      } catch (e) { testResult.value = { ok: false, error: e.message } }
      testRunning.value = false
    }

    // ── FIX v1.0: Draft save + unsaved changes warning ─────
    // ── Export / Import ──
    const showImport = ref(false)
    const showLibrary = ref(false)

    function exportWorkflow(wf) {
      const data = JSON.parse(JSON.stringify(wf))
      delete data._local  // remove internal fields
      const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'})
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url
      a.download = (data.name || 'workflow').replace(/[^a-zA-Z0-9_\-\u0600-\uffff]/g, '_') + '.json'
      a.click()
      URL.revokeObjectURL(url)
      saveMsg.value = t('wf_export_ok')
      setTimeout(() => saveMsg.value = '', 2000)
    }

    function exportAllWorkflows() {
      const all = { version: '1.0', exported: new Date().toISOString(), workflows: workflows.value }
      const blob = new Blob([JSON.stringify(all, null, 2)], {type: 'application/json'})
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url; a.download = 'phidipus_workflows_' + Date.now() + '.json'; a.click()
      URL.revokeObjectURL(url)
    }

    async function importWorkflowFromFile(file) {
      try {
        const text = await file.text()
        const data = JSON.parse(text)
        
        // Support single workflow or multi-export
        const wfs = data.workflows ? data.workflows : [data]
        
        for (const wf of wfs) {
          if (!wf.nodes || !Array.isArray(wf.nodes)) continue
          // Generate new ID to avoid conflicts
          wf.id = 'wf_' + Date.now() + '_' + Math.random().toString(36).slice(2,6)
          wf.name = wf.name || 'Imported Workflow'
          wf.imported = true
          wf.imported_at = new Date().toISOString()
          wf.active = true
          
          await api.post('/api/v2/workflow-teacher/save', { workflow: wf })
        }
        
        await fetchWorkflows()
        saveMsg.value = t('wf_import_ok')
        showImport.value = false
        setTimeout(() => saveMsg.value = '', 2000)
      } catch (e) {
        saveMsg.value = t('wf_import_err') + ': ' + e.message
      }
    }

    function handleDrop(e) {
      e.preventDefault()
      e.stopPropagation()
      const file = e.dataTransfer?.files?.[0]
      if (file && file.name.endsWith('.json')) {
        importWorkflowFromFile(file)
      } else {
        saveMsg.value = t('wf_import_err')
      }
    }

    function handleFilePick(e) {
      const file = e.target?.files?.[0]
      if (file) importWorkflowFromFile(file)
    }

    const hasDraft = ref(false)
    const isDirty = ref(false)
    const lastSavedState = ref('')

    function markDirty() { isDirty.value = true }

    // Watch for changes in activeWf (deep)
    watch([wfName, wfTrigger], () => { if (activeWf.value) isDirty.value = true }, { deep: true })

    // Auto-save draft every 10 seconds
    let draftTimer = null
    function startDraftTimer() {
      clearInterval(draftTimer)
      draftTimer = setInterval(() => {
        if (activeWf.value && isDirty.value) {
          saveDraft()
        }
      }, 10000)
    }
    function stopDraftTimer() { clearInterval(draftTimer) }

    function saveDraft() {
      if (!activeWf.value) return
      try {
        const draft = {
          workflow: JSON.parse(JSON.stringify(activeWf.value)),
          wfName: wfName.value,
          wfTrigger: wfTrigger.value,
          savedAt: Date.now(),
        }
        localStorage.setItem('ph_workflow_draft', JSON.stringify(draft))
        hasDraft.value = true
        isDirty.value = false
        console.log('[Draft] Auto-saved at', new Date().toLocaleTimeString())
      } catch {}
    }

    function loadDraft() {
      try {
        const raw = localStorage.getItem('ph_workflow_draft')
        if (!raw) return false
        const draft = JSON.parse(raw)
        if (!draft.workflow || Date.now() - draft.savedAt > 86400000) {
          localStorage.removeItem('ph_workflow_draft')
          return false
        }
        activeWf.value = draft.workflow
        wfName.value = draft.wfName || ''
        wfTrigger.value = draft.wfTrigger || ''
        selectedNode.value = null
        showList.value = false
        nextId = Math.max(...(draft.workflow.nodes||[]).map(n=>parseInt(n.id.split('_')[1])||0), 0) + 1
        hasDraft.value = true
        isDirty.value = false
        startDraftTimer()
        return true
      } catch { return false }
    }

    function clearDraft() {
      localStorage.removeItem('ph_workflow_draft')
      hasDraft.value = false
    }

    function confirmLeave() {
      if (!activeWf.value) return true
      if (!isDirty.value) return true
      if (activeWf.value.nodes?.length > 0) {
        const ok = confirm(
          t('wt_unsaved_warn')+'\n\n• '+t('wt_unsaved_ok')+'\n• '+t('wt_unsaved_cancel')
        )
        if (ok) {
          saveDraft() // Save draft before leaving
        }
        return ok
      }
      return true
    }

    function backToList() {
      if (!confirmLeave()) return
      showList.value = true
      activeWf.value = null
      selectedNode.value = null
      stopDraftTimer()
    }

    // Browser beforeunload warning
    function onBeforeUnload(e) {
      if (activeWf.value && activeWf.value.nodes?.length > 0) {
        saveDraft() // Auto-save draft
        e.preventDefault()
        e.returnValue = t('wf_unload')
        return e.returnValue
      }
    }

    onMounted(() => {
      window.addEventListener('beforeunload', onBeforeUnload)
      // Check for draft on mount
      const raw = localStorage.getItem('ph_workflow_draft')
      if (raw) hasDraft.value = true
      fetchWorkflows()
      // FIX BUG-NEW-3: ESC để cancel connect mode.
      // UI tooltip đã hiển thị "ESC huỷ" nhưng không có event listener nào xử lý.
      // Kết quả cũ: user bị kẹt trong connect mode nếu click nhầm — phải reload trang.
      function _wfKeyHandler(e) {
        if (e.key === 'Escape' && connecting.value) {
          connecting.value = null
        }
      }
      document.addEventListener('keydown', _wfKeyHandler)
      // Lưu ref để onUnmounted có thể remove đúng function
      window._wfKeyHandler = _wfKeyHandler
    })

    onUnmounted(() => {
      window.removeEventListener('beforeunload', onBeforeUnload)
      stopDraftTimer()
      // FIX BUG-NEW-3: cleanup ESC key handler
      if (window._wfKeyHandler) {
        document.removeEventListener('keydown', window._wfKeyHandler)
        delete window._wfKeyHandler
      }
    })

    // Chrome action options
    const CHROME_ACTIONS = computed(()=>[
      {value:'navigate', label:t('chr_navigate')},
      {value:'click_element', label:t('chr_click')},
      {value:'type_text', label:t('chr_type')},
      {value:'get_text', label:t('wf_get_text')},
      {value:'wait_element', label:t('chr_wait')},
      {value:'execute_js', label:t('wf_run_js')},
      {value:'click_download', label:t('wf_click_dl')},
    ])
    const FILE_ACTIONS = computed(()=>[
      {value:'find', label:t('file_find')},
      {value:'copy', label:'Copy file'},
      {value:'move', label:t('file_move')},
      {value:'list', label:t('file_list')},
      {value:'create_folder', label:t('wf_create_folder')},
      {value:'delete', label:t('file_delete')},
    ])

    // ── A4: Test Single Node ──────────────────────────────────────────
    const nodeTestRunning = ref(false)

    async function testSingleNode(node) {
      nodeTestRunning.value = true
      // Clear previous result
      node._testResult = null
      try {
        const r = await api.post('/api/v2/workflow-teacher/test-node', {
          ntype: node.type,
          config: node.config,
          mock_prev: ''
        })
        node._testResult = r.data
        // Force Vue reactivity
        activeWf.value = { ...activeWf.value }
      } catch(e) {
        node._testResult = { success: false, error: e.message || 'Network error' }
      } finally {
        nodeTestRunning.value = false
      }
    }

    // ── A5: Gallery ─────────────────────────────────────────────────
    const showGallery = ref(false)
    const galleryItems = ref([])
    const galleryLoading = ref(false)
    const galleryCategories = [
      { id:'sale',   icon:'💼', label:'Sale & Marketing' },
      { id:'office', icon:'🏢', label:'Văn phòng' },
      { id:'report', icon:'📊', label:'Báo cáo' },
      { id:'social', icon:'📱', label:'Social Media' },
      { id:'dev',    icon:'💻', label:'Developer' },
    ]
    const galleryFilter = ref('')

    async function loadGallery() {
      showGallery.value = true
      galleryLoading.value = true
      try {
        const r = await api.get('/api/v2/workflow-teacher/gallery')
        galleryItems.value = r.data?.templates || []
      } catch { galleryItems.value = [] }
      galleryLoading.value = false
    }

    async function installGalleryItem(item) {
      try {
        await api.post('/api/v2/workflow-teacher/save', { workflow: item.workflow || item })
        await fetchWorkflows()
        showGallery.value = false
        const installed = workflows.value.find(w => w.name === (item.name || item.workflow?.name))
        if (installed) editWorkflow(installed)
      } catch(e) { alert('Lỗi: ' + (e.message||'')) }
    }

    const galleryFiltered = computed(() =>
      galleryFilter.value
        ? galleryItems.value.filter(i =>
            (i.name||'').toLowerCase().includes(galleryFilter.value.toLowerCase()) ||
            (i.category||'').toLowerCase().includes(galleryFilter.value.toLowerCase()))
        : galleryItems.value
    )

    return {
      workflows, activeWf, selectedNode, connecting, wfName, wfTrigger, saveMsg,
      testResult, testRunning, showList,
      NODE_TYPES, CHROME_ACTIONS, FILE_ACTIONS, EXAMPLE_WORKFLOWS,
      AI_MODELS, AI_ACTIONS, appList, appScanning, scanApps,
      tooltipNode, tooltipPos, showTooltip, hideTooltip, showGuide, loadExample,
      addNode, removeNode, selectNode, startConnect, endConnect, removeConnection,
      getNode, nodeType, startDrag, getLines,
      newWorkflow, saveWorkflow, editWorkflow, deleteWorkflow, toggleWorkflow, testWorkflow,
      fetchWorkflows, backToList, defaultConfig, t,
      hasDraft, isDirty, saveDraft, loadDraft, clearDraft, startDraftTimer, markDirty,
      showImport, showLibrary, exportWorkflow, exportAllWorkflows, importWorkflowFromFile, handleDrop, handleFilePick,
      testSingleNode, nodeTestRunning,
      showGallery, galleryItems, galleryLoading, galleryCategories, galleryFilter, galleryFiltered,
      loadGallery, installGalleryItem
    }
  },
  template: `
  <div style="display:flex;flex-direction:column;gap:14px;height:calc(100vh - 80px)">
    <div style="display:flex;align-items:center;gap:10px">
      <h2 style="font-size:19px;font-weight:700">{{t('title_workflow')}}</h2>
      <span style="font-size:12px;color:var(--muted)">{{t('wf_subtitle')}}</span>
      <button v-if="activeWf" class="btn btn-ghost" @click="backToList" style="margin-left:auto;font-size:13px">{{t('btn_back_list')}}</button>
      <button class="btn btn-bee" @click="newWorkflow" style="font-size:13px" :style="{marginLeft:activeWf?0:'auto'}">{{t('btn_new_workflow')}}</button>
        <button class="btn btn-ghost" @click="showImport=!showImport" style="font-size:13px">{{t('wf_import')}}</button>
        <button class="btn btn-ghost" @click="showLibrary=!showLibrary" style="font-size:13px">{{t('wf_library')}}</button>
    </div>

    <!-- WORKFLOW LIST + GUIDE -->
    <div v-if="showList&&!activeWf" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px">
      <!-- Import Dropzone -->
      <div v-if="showImport" class="card" style="margin-bottom:14px;border-color:var(--info);border-style:dashed">
        <div @drop="handleDrop" @dragover.prevent @dragenter.prevent
          style="padding:30px;text-align:center;cursor:pointer;border-radius:6px;transition:all .15s"
          @click="$refs.fileInput?.click()"
          @dragover="$event.currentTarget.style.background='rgba(56,189,248,.08)'"
          @dragleave="$event.currentTarget.style.background='transparent'">
          <div style="font-size:32px;margin-bottom:8px">📥</div>
          <div style="font-size:14px;font-weight:600">{{t('wf_import_hint')}}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:6px">.json · max 5MB</div>
          <input ref="fileInput" type="file" accept=".json" @change="handleFilePick" style="display:none"/>
        </div>
      </div>

      <!-- Library Panel -->
      <div v-if="showLibrary" class="card" style="margin-bottom:14px;border-color:var(--bee)">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
          <span style="font-size:20px">🌐</span>
          <div>
            <div style="font-size:15px;font-weight:700">{{t('wf_library')}}</div>
            <div style="font-size:12px;color:var(--muted)">{{t('wf_lib_subtitle')}}</div>
          </div>
          <button @click="showLibrary=false" style="margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px">✕</button>
        </div>
        <div style="padding:20px;text-align:center;background:var(--bg);border-radius:6px">
          <div style="font-size:40px;margin-bottom:8px">🚀</div>
          <div style="font-size:13px;color:var(--muted)">{{t('wf_lib_coming')}}</div>
        </div>
        <div style="margin-top:12px;display:flex;gap:6px">
          <button class="btn btn-ghost" @click="exportAllWorkflows" style="font-size:12px">{{t('wf_export_all')}}</button>
        </div>
      </div>

      <!-- Tab toggle: Workflows / Hướng dẫn -->
      <div style="display:flex;gap:6px">
        <button class="btn" :class="showGuide?'btn-ghost':'btn-bee'" @click="showGuide=false" style="font-size:13px">{{t('btn_workflows')}} ({{workflows.length}})</button>
        <button class="btn" :class="showGuide?'btn-bee':'btn-ghost'" @click="showGuide=true" style="font-size:13px">{{t('btn_guide')}}</button>
      </div>

      <!-- GUIDE TAB -->
      <div v-if="showGuide" class="card" style="overflow-y:auto">
        <!-- How it works -->
        <div style="margin-bottom:16px">
          <div style="font-size:16px;font-weight:700;margin-bottom:8px">{{t('wf_how_title')}}</div>
          <div style="font-size:13px;line-height:2;color:var(--txt2)">
            <b>{{t('wt_step1')}}</b><br/>
            <b>{{t('wt_step2')}}</b><br/>
            <b>{{t('wt_step3')}}</b><br/>
            <b>{{t('wt_step4')}}</b><br/>
            <b>{{t('wt_step5')}}</b><br/>
            <b>{{t('wt_result')}}</b>
          </div>
        </div>
        <!-- Node reference -->
        <div style="margin-bottom:16px">

          </div>
        </div>

            @mouseleave="$event.currentTarget.style.borderColor='var(--border)';$event.currentTarget.style.background='var(--bg2)'">
            <div style="font-size:14px;font-weight:700;margin-bottom:4px">{{ex.name}}</div>
            <div style="font-size:12px;color:var(--txt2);margin-bottom:6px">{{ex.desc}}</div>
            <div style="font-size:11px;color:var(--muted)">Trigger: {{ex.trigger}}</div>
            <div style="font-size:11px;color:var(--bee);margin-top:4px">{{ex.nodes.length}} {{t('wf_steps_count')}} · {{t('wf_click_load')}}</div>
          </div>
        </div>
      </div>

      <!-- WORKFLOW LIST -->
      <div v-if="!showGuide" class="card">
        <!-- Draft recovery banner -->
        <div v-if="hasDraft&&!activeWf" style="padding:10px 14px;margin-bottom:8px;background:rgba(234,179,8,.06);border:1px solid rgba(234,179,8,.2);border-radius:4px;display:flex;align-items:center;gap:10px;font-size:13px">
          <span style="font-size:18px">📝</span>
          <span style="flex:1;color:var(--txt2)">{{t('wf_draft_msg')}}</span>
          <button class="btn btn-bee" @click="loadDraft()" style="font-size:12px;padding:5px 12px">{{t('btn_recover')}}</button>
          <button class="btn btn-ghost" @click="clearDraft()" style="font-size:12px;padding:5px 8px;color:var(--danger)">{{t('wf_delete_draft')}}</button>
        </div>
        <div v-if="!workflows.length&&!hasDraft" style="text-align:center;padding:30px;color:var(--muted)">
          <div style="font-size:34px;margin-bottom:8px">🎓</div>
          <div style="font-size:15px;font-weight:600;margin-bottom:4px">{{t('wf_no_workflows')}}</div>
          <div style="font-size:12px;line-height:1.7;max-width:380px;margin:0 auto 10px">
            {{t('wf_hint_start')}}
          </div>
          <button class="btn btn-ghost" @click="showGuide=true" style="font-size:12px">{{t('wf_view_guide')}}</button>
        </div>
        <div v-for="wf in workflows" :key="wf.id" style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border)">
          <span :style="{width:'10px',height:'10px',borderRadius:'50%',background:wf.active?'#22c55e':'#52525b',flexShrink:0}"></span>
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:600">{{wf.name||'Unnamed'}}</div>
            <div style="font-size:11px;color:var(--muted)">{{wf.trigger_phrases?.join(' · ')||t('wf_no_trigger')}} · {{(wf.nodes||[]).length}} {{t('wf_steps_count')}}</div>
          </div>
          <button class="btn btn-ghost" @click="toggleWorkflow(wf)" style="font-size:12px" :title="wf.active?t('wf_pause'):t('wf_activate')">{{wf.active?'⏸':'▶'}}</button>
          <button class="btn btn-ghost" @click="exportWorkflow(wf)" style="font-size:12px" title="Export">📤</button>
            <button class="btn btn-bee" @click="editWorkflow(wf)" style="font-size:12px" :title="t('wf_edit_wf')">✏️ Sửa</button>
          <button class="btn btn-ghost" @click="deleteWorkflow(wf.id)" style="font-size:12px;color:var(--danger)" :title="t('wf_delete_wf')">🗑</button>
        </div>
      </div>
    </div>

    <!-- WORKFLOW EDITOR -->
    <div v-if="activeWf" style="display:flex;gap:10px;flex:1;overflow:hidden">
      <!-- LEFT: Node Palette -->
      <div style="width:140px;flex-shrink:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px">
        <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px;padding:0 4px">NODES</div>
        <div v-for="nt in NODE_TYPES" :key="nt.type" @click="addNode(nt.type)"
          style="display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:var(--bg2);font-size:12px;transition:all .15s;position:relative"
          @mouseenter="showTooltip(nt,$event);$event.currentTarget.style.borderColor=nt.color"
          @mouseleave="hideTooltip();$event.currentTarget.style.borderColor='var(--border)'">
          <span>{{nt.icon}}</span>
          <span style="font-weight:600">{{nt.label}}</span>
        </div>
        <!-- Floating tooltip -->
        <div v-if="tooltipNode" class="wt-tooltip" :style="{top:tooltipPos.y+'px',left:tooltipPos.x+'px'}">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.1)">
            <span style="font-size:18px">{{tooltipNode.icon}}</span>
            <span style="font-size:14px;font-weight:700" :style="{color:tooltipNode.color}">{{tooltipNode.label}}</span>
          </div>
          <div style="font-size:12px;white-space:pre-line;line-height:1.6;color:#d4d4d4;margin-bottom:6px">{{tooltipNode.hint}}</div>
          <div style="font-size:11px;white-space:pre-line;line-height:1.6;color:#22c55e;background:rgba(34,197,94,.06);padding:6px 8px;border-radius:4px;margin-top:4px">{{tooltipNode.tips}}</div>
        </div>
        <div style="margin-top:auto;padding:8px 4px">
          <div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px">WORKFLOW</div>
          <input class="inp" v-model="wfName" :placeholder="t('wf_name')" style="font-size:12px;padding:5px 7px;margin-bottom:4px;width:100%"/>
          <input class="inp" v-model="wfTrigger" :placeholder="t('wf_trigger')" style="font-size:12px;padding:5px 7px;margin-bottom:6px;width:100%"/>
          <button class="btn btn-bee" @click="saveWorkflow" style="width:100%;font-size:12px;padding:6px" :disabled="!activeWf.nodes.length">{{saveMsg||t('btn_save')}}</button>
          <button class="btn btn-ghost" @click="saveDraft" style="width:100%;font-size:12px;padding:5px;margin-top:3px" title="Lưu nháp vào trình duyệt (tự động mỗi 10s)">📝 {{isDirty?'Lưu nháp ●':'Đã lưu nháp ✓'}}</button><!-- tooltip -->
          <button class="btn btn-ghost" @click="testWorkflow" :disabled="testRunning" style="width:100%;font-size:12px;padding:5px;margin-top:4px">{{testRunning?'⏳...':'▶ Test'}}</button>
          <div v-if="testResult" style="font-size:11px;margin-top:4px" :style="{color:testResult.ok?'var(--bee)':'var(--danger)'}">{{testResult.ok?'✅ OK':'❌ '+testResult.error}}</div>
        </div>
      </div>

      <!-- CENTER: Canvas -->
      <div class="wt-canvas" style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;position:relative;overflow:auto;min-height:400px">
        <!-- Grid background -->
        <svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.1">
          <defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="currentColor" stroke-width="0.5"/></pattern></defs>
          <rect width="100%" height="100%" fill="url(#grid)"/>
        </svg>
        <!-- FIX BUG#4: Connection lines SVG — auto-size to max node position instead of hardcoded 2000×2000 -->
        <svg :style="'position:absolute;inset:0;pointer-events:none;z-index:1;width:'+(Math.max(800,...(activeWf?.nodes||[]).map(n=>n.x+220)))+'px;height:'+(Math.max(400,...(activeWf?.nodes||[]).map(n=>n.y+120)))+'px'">
          <!-- Normal edges (green) -->
          <path v-for="line in getLines().filter(l=>!l.isThen&&!l.isElse)" :key="line.key"
            :d="'M '+(line.from.x+90)+' '+(line.from.y+30)+' C '+(line.from.x+90)+' '+(line.from.y+70)+' '+(line.to.x+90)+' '+(line.to.y-10)+' '+(line.to.x+90)+' '+(line.to.y+10)"
            stroke="#22c55e" stroke-width="2" fill="none" stroke-dasharray="4 2" opacity=".6"/>
          <!-- Then edges (green solid) -->
          <path v-for="line in getLines().filter(l=>l.isThen)" :key="'t'+line.key"
            :d="'M '+(line.from.x+90)+' '+(line.from.y+30)+' C '+(line.from.x+90)+' '+(line.from.y+70)+' '+(line.to.x+90)+' '+(line.to.y-10)+' '+(line.to.x+90)+' '+(line.to.y+10)"
            stroke="#4ade80" stroke-width="2.5" fill="none"/>
          <!-- Else edges (red dashed) -->
          <path v-for="line in getLines().filter(l=>l.isElse)" :key="'e'+line.key"
            :d="'M '+(line.from.x+90)+' '+(line.from.y+30)+' C '+(line.from.x+90)+' '+(line.from.y+70)+' '+(line.to.x+90)+' '+(line.to.y-10)+' '+(line.to.x+90)+' '+(line.to.y+10)"
            stroke="#f87171" stroke-width="2" fill="none" stroke-dasharray="6 3"/>
          <!-- Arrowhead dots -->
          <circle v-for="line in getLines()" :key="'d'+line.key" :cx="line.to.x+90" :cy="line.to.y+10" r="4" :fill="line.isElse?'#f87171':line.isThen?'#4ade80':'#22c55e'"/>
          <!-- Then/Else labels -->
          <text v-for="line in getLines().filter(l=>l.isThen||l.isElse)" :key="'lbl'+line.key"
            :x="(line.from.x+line.to.x)/2+90" :y="(line.from.y+line.to.y)/2+20"
            :fill="line.isElse?'#f87171':'#4ade80'" font-size="10" text-anchor="middle" font-weight="700">
            {{line.isThen?'TRUE':'FALSE'}}
          </text>
        </svg>
        <!-- Nodes — FIX BUG#5: highlight source node during connect mode -->
        <div v-for="node in activeWf.nodes" :key="node.id" class="wt-node"
          :style="{
            left:node.x+'px',top:node.y+'px',
            borderColor: connecting?.id===node.id ? '#eab308' : selectedNode?.id===node.id ? (nodeType(node.type).color||'var(--bee)') : 'var(--border)',
            boxShadow: connecting?.id===node.id ? '0 0 0 3px rgba(234,179,8,.35), 0 0 18px rgba(234,179,8,.2)' : 'none',
            opacity: connecting && connecting.id!==node.id ? '.75' : '1'
          }"
          @click.stop="selectNode(node)" @mousedown="startDrag($event,node)">
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-size:16px">{{nodeType(node.type).icon}}</span>
            <span style="font-size:12px;font-weight:700;flex:1">{{nodeType(node.type).label}}</span>
            <span style="font-size:10px;color:var(--muted);font-family:var(--mono)">{{node.id}}</span>
          </div>
          <div style="font-size:11px;color:var(--muted);margin-top:3px;max-height:32px;overflow:hidden">
            <template v-if="node.type==='trigger'">{{node.config.phrases?.join(', ')||t('wf_click_config')}}</template>
            <template v-else-if="node.type==='chrome'">{{node.config.action}}: {{node.config.url||node.config.selector||'...'}}</template>
            <template v-else-if="node.type==='file'">{{node.config.action}}: {{node.config.path||node.config.pattern||'...'}}</template>
            <template v-else-if="node.type==='terminal'">$ {{node.config.command||'...'}}</template>
            <template v-else-if="node.type==='type_text'">{{(node.config.text||'...').slice(0,40)}}</template>
            <template v-else-if="node.type==='click'">{{node.config.target||'Click...'}}</template>
            <template v-else-if="node.type==='wait'">{{node.config.seconds}}s {{node.config.wait_for_selector?'+ '+node.config.wait_for_selector:''}}</template>
            <template v-else-if="node.type==='notify'">{{(node.config.message||'').slice(0,40)}}</template>
            <template v-else-if="node.type==='scroll'">{{node.config.scroll_to_selector||('↓ '+node.config.pixels+'px')}}</template>
            <template v-else-if="node.type==='download_wait'">{{node.config.pattern}} → {{node.config.move_to||'Downloads'}} ({{node.config.timeout}}s)</template>
            <template v-else-if="node.type==='app_launch'">{{node.config.app_name||t('wf_choose_app')}}</template>
            <template v-else-if="node.type==='ai_process'">🤖 {{node.config.action}} ({{node.config.model}})</template>
            <template v-else-if="node.type==='vision_click'">👁️ {{node.config.description||t('wf_desc_el')}}</template>
                <template v-else-if="node.type==='generate_report'">📊 {{node.config.title||'Report'}}</template>
                <template v-else-if="node.type==='create_document'">📄 {{node.config.title||node.config.format?.toUpperCase()||'Doc'}}</template>
            <template v-else>{{t('wt_click_config')}}</template>
          </div>
          <!-- A4: Test Single Node button -->
          <div @click.stop="testSingleNode(node)" :title="t('node_test_run')"
               style="position:absolute;top:-6px;left:-6px;width:16px;height:16px;border-radius:50%;background:#3b82f6;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.85;z-index:5">▶</div>
          <!-- A4: Test result overlay -->
          <div v-if="node._testResult" :style="{marginTop:'6px',padding:'4px 6px',borderRadius:'4px',fontSize:'11px',background:node._testResult.success?'rgba(34,197,94,.1)':'rgba(239,68,68,.1)',border:'1px solid '+(node._testResult.success?'rgba(34,197,94,.3)':'rgba(239,68,68,.3)'),lineHeight:'1.4'}">
            <span>{{node._testResult.success?'✅':'❌'}}</span>
            <span style="color:var(--muted)"> {{node._testResult.elapsed_s}}s</span>
            <span v-if="node._testResult.error" style="color:#f87171;display:block;margin-top:2px;font-size:10px">{{(node._testResult.error||'').slice(0,60)}}</span>
            <span v-if="node._testResult.result&&!node._testResult.error" style="color:var(--txt2);display:block;margin-top:2px;font-size:10px">{{String(node._testResult.result).slice(0,60)}}</span>
            <img v-if="node._testResult.screenshot_b64" :src="'data:image/jpeg;base64,'+node._testResult.screenshot_b64" style="width:100%;border-radius:3px;margin-top:4px"/>
          </div>
          <!-- Connect button -->
          <div @click.stop="connecting?endConnect(node):startConnect(node)" :title="connecting?t('wf_connect_hint'):t('wf_drag_connect')" style="position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;cursor:crosshair;z-index:5" :style="{background:connecting?'#eab308':'#22c55e',boxShadow:connecting?'0 0 8px rgba(234,179,8,.6)':'0 0 6px rgba(34,197,94,.4)'}"></div>
          <!-- Delete button -->
          <div v-if="node.type!=='trigger'" @click.stop="removeNode(node.id)" style="position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:#ef4444;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.7" title="Xóa node">✕</div>
        </div>
        <div v-if="connecting" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(234,179,8,.15);border:1px solid rgba(234,179,8,.4);color:#eab308;padding:6px 16px;border-radius:20px;font-size:13px;z-index:100">🔗 Click node đích để nối — ESC huỷ</div>

      <!-- A5: Gallery Modal -->
      <div v-if="showGallery" style="position:fixed;inset:0;z-index:8888;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center" @click.self="showGallery=false">
        <div style="width:680px;max-height:80vh;background:var(--bg2);border-radius:12px;border:1px solid var(--border-a);display:flex;flex-direction:column;overflow:hidden">
          <div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px">
            <span style="font-size:18px">🗂️</span>
            <span style="font-size:16px;font-weight:700">{{t('gallery_title')}}</span>
            <input class="inp" v-model="galleryFilter" placeholder="Tìm kiếm..." style="margin-left:auto;width:180px;font-size:12px"/>
            <button class="btn btn-ghost" @click="showGallery=false" style="font-size:18px;padding:2px 8px">✕</button>
          </div>
          <!-- Category chips -->
          <div style="display:flex;gap:8px;padding:12px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap">
            <button v-for="cat in galleryCategories" :key="cat.id" class="btn btn-ghost"
              @click="galleryFilter=galleryFilter===cat.id?'':cat.id"
              :style="{fontSize:'12px',borderColor:galleryFilter===cat.id?'var(--bee)':'var(--border)',color:galleryFilter===cat.id?'var(--bee)':'var(--txt2)'}">
              {{cat.icon}} {{cat.label}}
            </button>
          </div>
          <div style="overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px">
            <div v-if="galleryLoading" style="text-align:center;color:var(--muted);padding:32px">⟳ Đang tải...</div>
            <div v-else-if="!galleryFiltered.length" style="text-align:center;color:var(--muted);padding:32px">Không có workflow nào</div>
            <div v-for="item in galleryFiltered" :key="item.id||item.name"
              style="display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg3);border-radius:8px;border:1px solid var(--border)">
              <div style="font-size:24px">{{item.icon||'📋'}}</div>
              <div style="flex:1">
                <div style="font-size:14px;font-weight:600">{{item.name}}</div>
                <div style="font-size:11px;color:var(--muted);margin-top:2px">{{item.description||''}} • {{(item.workflow?.nodes||[]).length||item.nodes_count||0}} nodes</div>
              </div>
              <button class="btn btn-bee" @click="installGalleryItem(item)" style="font-size:12px;padding:4px 12px">{{t('gallery_install')}}</button>
            </div>
          </div>
        </div>
      </div>
      </div>

      <!-- RIGHT: Config Panel -->
      <div style="width:240px;flex-shrink:0;overflow-y:auto;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:12px">
        <div v-if="!selectedNode" style="text-align:center;color:var(--muted);padding:30px 0;font-size:13px">
          <div style="font-size:26px;margin-bottom:8px">👈</div>
          {{t('wt_select_node')}}
        </div>
        <div v-else>
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)">
            <span style="font-size:18px">{{nodeType(selectedNode.type).icon}}</span>
            <span style="font-size:14px;font-weight:700">{{nodeType(selectedNode.type).label}}</span>
          </div>
          <div style="font-size:11px;color:var(--muted);margin-bottom:10px">{{nodeType(selectedNode.type).desc}}</div>

          <!-- Trigger config -->
          <template v-if="selectedNode.type==='trigger'">
            <label class="wt-label">{{t('wf_trigger_label')}}</label>
            <textarea class="inp" v-model="wfTrigger" rows="4" :placeholder="t('wf_trigger_hint')" style="width:100%;font-size:12px;resize:vertical"></textarea>
            <label class="wt-label" style="margin-top:8px">{{t('sp_desc')}}</label>
            <input class="inp" v-model="selectedNode.config.description" :placeholder="t('wf_desc_ph')" style="width:100%;font-size:12px"/>
          </template>

          <!-- Chrome config -->
          <template v-if="selectedNode.type==='chrome'">
            <label class="wt-label">Action</label>
            <select class="inp" v-model="selectedNode.config.action" style="width:100%;font-size:12px;padding:5px">
              <option v-for="a in CHROME_ACTIONS" :key="a.value" :value="a.value">{{a.label}}</option>
            </select>
            <label class="wt-label" style="margin-top:6px">URL</label>
            <input class="inp" v-model="selectedNode.config.url" placeholder="https://..." style="width:100%;font-size:12px"/>
            <label class="wt-label" style="margin-top:6px">CSS Selector</label>
            <input class="inp" v-model="selectedNode.config.selector" placeholder="#btn-submit, .class-name" style="width:100%;font-size:12px"/>
            <label class="wt-label" style="margin-top:6px">{{t('wf_text_label')}}</label>
            <input class="inp" v-model="selectedNode.config.text" :placeholder="t('wf_content_ph')" style="width:100%;font-size:12px"/>
            <label class="wt-label" style="margin-top:6px">{{t('wf_wait_after')}}</label>
            <input class="inp" type="number" v-model.number="selectedNode.config.wait_after" min="0" max="30" style="width:80px;font-size:12px"/>
          </template>

          <!-- File config -->
          <template v-if="selectedNode.type==='file'">
            <label class="wt-label">Action</label>
            <select class="inp" v-model="selectedNode.config.action" style="width:100%;font-size:12px;padding:5px">
              <option v-for="a in FILE_ACTIONS" :key="a.value" :value="a.value">{{a.label}}</option>
            </select>
            <label class="wt-label" style="margin-top:6px">{{t('wf_path_label')}}</label>

      try{ const ks=await api.get('/api/v2/config/key-status'); if(ks.data) for(const[k,v] of Object.entries(ks.data)) keyStatus[k]=!!v }catch{}
      try{ const r=await api.get('/api/v2/providers'); if(r.data?.providers?.length>0){ providers.value=r.data.providers; for(const p of r.data.providers){if(p.has_key){const c=KEY_CARDS.find(x=>x.names?.includes(p.name));if(c)keyStatus[c.id]=true}} } }catch{}
      try{ const lr=await api.get('/api/v2/providers/logs'); logs.value=lr.data?.logs||[] }catch{}
      try{ const br=await api.get('/api/v2/providers/budget'); budget.value=br.data?.budget||[] }catch{}
    }

    // FIX v1.0: Unified addKey — 1 ô input, điền 3 lần, hiện masked keys
    async function addKey(c){
      const val=(keyInputs[c.id]||'').trim(); if(!val) return
      if(!savedKeys[c.id]) savedKeys[c.id]=[]
      if(savedKeys[c.id].length>=3){ saveState[c.id]='full'; setTimeout(()=>{saveState[c.id]=''},2000); return }
      saveState[c.id]='saving'
      try{
        // Gửi key lên backend
        for(const n of(c.names||[])){ await api.post('/api/v2/providers/'+encodeURIComponent(n)+'/api-key',{api_key:val}).catch(()=>{}) }
        const allKeys=savedKeys[c.id].map(k=>k.full).concat([val])
        await api.post('/api/v2/config/api-key',{provider:c.id,api_key:allKeys[0],backup_keys:allKeys.slice(1)}).catch(()=>{})
        // Lưu masked vào UI
        savedKeys[c.id].push({masked:maskKey(val),full:val})
        _persistKeys()
        keyStatus[c.id]=true; saveState[c.id]='ok'; keyInputs[c.id]=''
        await fetchAll(); setTimeout(()=>{saveState[c.id]=''},2000)
      }catch{ saveState[c.id]='error'; setTimeout(()=>{saveState[c.id]=''},3000) }
    }
    async function removeKey(c,idx){
      if(!savedKeys[c.id]) return
      savedKeys[c.id].splice(idx,1)
      _persistKeys()
      if(savedKeys[c.id].length===0){ keyStatus[c.id]=false }
      // Re-sync backend with remaining keys
      const remaining=savedKeys[c.id].map(k=>k.full)
      if(remaining.length>0){
        await api.post('/api/v2/config/api-key',{provider:c.id,api_key:remaining[0],backup_keys:remaining.slice(1)}).catch(()=>{})
        for(const n of(c.names||[])){ await api.post('/api/v2/providers/'+encodeURIComponent(n)+'/api-key',{api_key:remaining[0]}).catch(()=>{}) }
      }
      await fetchAll()
    }
    // Legacy compat
    async function saveKey(c){ return addKey(c) }

    async function moveProvider(n,d){
      try{ const r=await api.post('/api/v2/providers/'+encodeURIComponent(n)+'/move',{direction:d}); if(r.data?.providers?.length) providers.value=r.data.providers }catch{ await fetchAll() }
    }
    async function toggleProvider(n,e){
      await api.post('/api/v2/providers/'+encodeURIComponent(n)+'/toggle',{enabled:e}).catch(()=>{})
      await fetchAll()
    }
    async function removeCustom(name){
      if(!confirm('Xóa provider "'+name+'"?'))return
      await api.post('/api/v2/providers/custom/remove',{name}).catch(()=>{})
      await fetchAll()
    }

    async function doExport(){ try{ const r=await api.get('/api/v2/config/export'); exportJson.value=JSON.stringify(r.data?.config||{},null,2) }catch{ exportJson.value='Lỗi export' } }
    async function doImport(){ importMsg.value=''; try{ const cfg=JSON.parse(importText.value); await api.post('/api/v2/config/import',{config:cfg}); importMsg.value='✅ OK! Restart để áp dụng.'; importText.value='' }catch(e){ importMsg.value='❌ '+(e.message||'Lỗi') } }
    function copyEx(){ navigator.clipboard?.writeText(exportJson.value) }
    function fmtT(ts){ return new Date(ts*1000).toLocaleTimeString('vi-VN') }
    async function askAI(){ aiLoading.value=true; aiSuggestion.value=''; try{ const r=await api.post('/api/v2/providers/optimize'); aiSuggestion.value=r.data?.suggestion||'Không có gợi ý' }catch(e){ aiSuggestion.value='❌ Lỗi: '+(e.message||'Không kết nối được') }finally{ aiLoading.value=false } }

    async function testCustom(){
      customTesting.value=true; customTestResult.value=null
      try{ const r=await api.post('/api/v2/providers/custom/test',{base_url:customForm.base_url,model:customForm.model,api_key:customForm.api_key}); customTestResult.value=r.data }
      catch(e){ customTestResult.value={ok:false,error:e.message||'Lỗi kết nối'} }
      finally{ customTesting.value=false }
    }
    async function addCustom(){
      if(!customForm.name||!customForm.base_url||!customForm.model){customMsg.value='❌ Điền đủ Name, URL, Model';return}
      try{ await api.post('/api/v2/providers/custom/add',{...customForm}); customMsg.value='✅ Đã thêm '+customForm.name; customForm.name=''; customForm.base_url=''; customForm.model=''; customForm.api_key=''; customTestResult.value=null; await fetchAll() }
      catch(e){ customMsg.value='❌ '+(e.message||'Lỗi') }
      setTimeout(()=>{customMsg.value=''},4000)
    }

    async function fetchOllama(){
      ollamaScanning.value=true; ollamaDebugErr.value=''
      try{
        const r=await api.get('/api/v2/ollama/models')
        ollamaModels.value=r.data?.models||[]
        ollamaRunning.value=r.data?.ollama_running===false?false:true
        const dbg=r.data?.debug
        if(Array.isArray(dbg)&&dbg.length>0) ollamaDebugErr.value=dbg.join(' | ')
        else if(r.data?.error) ollamaDebugErr.value=r.data.error
      }catch(e){ ollamaRunning.value=null; ollamaDebugErr.value='Không kết nối được backend: '+e.message }
      finally{ ollamaScanning.value=false }
    }
    async function toggleOllama(){
      showOllama.value=!showOllama.value
      if(showOllama.value&&ollamaRunning.value===null) await fetchOllama()
    }

    async function pullModel(){
      const name=pullName.value.trim(); if(!name||isPulling.value)return
      isPulling.value=true; terminalLines.value=[]
      const url=API_BASE+'/api/v2/ollama/pull-stream?name='+encodeURIComponent(name)
      try{
        const resp=await fetch(url)
        if(!resp.ok||!resp.body){ terminalLines.value.push('❌ HTTP '+resp.status); isPulling.value=false; return }
        const reader=resp.body.getReader(); const decoder=new TextDecoder(); let buf=''
        while(true){
          const{done,value}=await reader.read(); if(done) break
          buf+=decoder.decode(value,{stream:true})
          const parts=buf.split('\n\n'); buf=parts.pop()||''
          for(const block of parts){
            for(const line of block.split('\n')){
              if(line.startsWith('data: ')){
                const msg=line.slice(6)
                if(msg==='__DONE__'){ isPulling.value=false; await fetchOllama(); pullName.value=''; return }
                terminalLines.value.push(msg)
                if(terminalEl.value) terminalEl.value.scrollTop=terminalEl.value.scrollHeight
              }
            }
          }
        }
      }catch(e){ terminalLines.value.push('❌ Lỗi: '+e.message) }
      finally{ isPulling.value=false }
    }

    async function addOllamaToStack(name){
      try{ await api.post('/api/v2/ollama/add-to-stack',{name}); await fetchAll(); await fetchOllama() }catch{}
    }

    onMounted(async()=>{ await fetchAll(); timer=setInterval(fetchAll,15000) })
    onUnmounted(()=>clearInterval(timer))

    return {
      providers,logs,budget,keyInputs,saveState,keyStatus,KEY_CARDS,FREE_MODELS,savedKeys,maskKey,addKey,removeKey,
      showAdd,showCustom,showOllama,exportJson,importText,importMsg,
      aiSuggestion,aiLoading,customForm,customMsg,customTesting,customTestResult,
      ollamaModels,ollamaRunning,ollamaScanning,ollamaDebugErr,pullName,isPulling,terminalLines,terminalEl,
      hasKey,fetchAll,saveKey,moveProvider,toggleProvider,removeCustom,
      doExport,doImport,copyEx,fmtT,askAI,testCustom,addCustom,
      fetchOllama,toggleOllama,pullModel,addOllamaToStack
    }

        <span v-if="customMsg" style="font-size:13px" :style="{color:customMsg.startsWith('✅')?'var(--bee)':'var(--danger)'}">{{customMsg}}</span>

        <button class="btn btn-bee" @click="copyEx" style="font-size:13px">📋 Copy</button>

      </div>
    </div>

    <!-- API Keys (core providers) — FIX v1.0: unified multi-key -->
    <div class="card">
      <div class="panel-title">🔑 API Keys</div>

      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px">

            <div style="flex:1"><b style="font-size:14px;display:block">{{c.label}}</b><span style="font-size:11px;color:var(--muted);font-family:var(--mono)">{{c.model}}</span></div>
            <span style="font-size:10px;padding:2px 6px;border-radius:3px;font-weight:700" :style="{background:'rgba(34,197,94,.12)',color:'#22c55e'}">{{c.tier}}</span>
            <span style="width:10px;height:10px;border-radius:50%;flex-shrink:0" :style="{background:hasKey(c)?'#22c55e':'#ef4444',boxShadow:hasKey(c)?'0 0 6px rgba(34,197,94,.5)':'0 0 6px rgba(239,68,68,.4)'}"></span>

              <span style="font-size:11px;color:var(--muted);min-width:14px">{{ki+1}}.</span>
              <span style="font-size:12px;font-family:var(--mono);color:var(--bee);flex:1;letter-spacing:.5px">{{k.masked}}</span>
              <button @click="removeKey(c,ki)" style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:12px;padding:0 4px;opacity:.6" title="Xóa key này">✕</button>
            </div>
          </div>
          <!-- Input (chỉ hiện nếu chưa đủ 3 keys) -->
          <div v-if="!savedKeys[c.id]||savedKeys[c.id].length<3" style="display:flex;gap:4px;margin-bottom:4px">
            <input class="inp" v-model="keyInputs[c.id]" type="password" :placeholder="c.ph+' (key '+(savedKeys[c.id]?.length||0)+1+'/3)'" @keydown.enter="addKey(c)" style="flex:1;font-size:12px;padding:6px 8px"/>
